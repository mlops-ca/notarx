name: notarx-integration

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1::5432"
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: notarx_test
      POSTGRES_USER: notarx
      POSTGRES_PASSWORD: integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U notarx -d notarx_test"]
      interval: 1s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: integration-password
      PGDATABASE: notarx_test
    entrypoint: ["/usr/local/bin/run-migrations"]
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/usr/local/bin/run-migrations:ro

  test:
    image: golang:1.27.4-alpine@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs-ready:
        condition: service_completed_successfully
    environment:
      TEST_DATABASE_URL: postgres://notarx:integration-password@postgres:5432/notarx_test?sslmode=disable
      TEST_OBJECT_STORE_ENDPOINT: http://rustfs:9000
      TEST_OBJECT_STORE_ACCESS_KEY: integration-rustfs
      TEST_OBJECT_STORE_SECRET_KEY: integration-password
      # make integration-test runs the plan-regression suite at a tenth of the tiny
      # profile; make explain-check overrides it to 1 for the whole profile.
      NOTARX_EXPLAIN_SCALE: ${NOTARX_EXPLAIN_SCALE:-10}
    working_dir: /src
    # No default command: callers pass the go test invocation. The integration package
    # list and its CI shards live in scripts/integration-test.sh.
    command: ["sh", "-ec", "echo 'pass a go test command (scripts/integration-test.sh, scripts/explain-check.sh)' >&2; exit 2"]
    volumes:
      - ./:/src:ro
      - notarx-go-mod:/go/pkg/mod
      - notarx-go-build:/root/.cache/go-build

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    ports:
      - "127.0.0.1::9000"
    entrypoint: ["/bin/sh", "/usr/local/bin/run-rustfs"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: integration-rustfs
      RUSTFS_SECRET_KEY: integration-password
      RUSTFS_RPC_SECRET: integration-rustfs-independent-rpc-secret
    volumes:
      - ./scripts/run-rustfs.sh:/usr/local/bin/run-rustfs:ro

  rustfs-ready:
    image: curlimages/curl:8.23.0
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: ["until curl --fail --silent http://rustfs:9000/health > /dev/null; do sleep 1; done"]

volumes:
  notarx-go-mod:
    external: true
  notarx-go-build:
    external: true
