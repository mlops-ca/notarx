# Reference nginx server block for the notarx console package (ADR 0025).
# Copy to /etc/nginx/conf.d/notarx.conf, set server_name and add TLS.
# The notarx server does not serve the console: static assets come from
# /usr/share/notarx/console and every API and protocol prefix is proxied to the
# server on 127.0.0.1:8080. Keep the prefixes in step with
# deploy/kubernetes/console/default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/notarx/console;
    index index.html;

    location ~ ^/(api|auth|v2|raw|repository|maven|conan|npm|pypi|go|apt)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        client_max_body_size 0;
    }

    location ~ ^/(livez|readyz|healthz)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
