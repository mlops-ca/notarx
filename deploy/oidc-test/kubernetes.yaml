apiVersion: v1
kind: Namespace
metadata:
  name: notarx-oidc-test
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: notarx
            - name: POSTGRES_USER
              value: notarx
            - name: POSTGRES_PASSWORD
              value: notarx-oidc-test-db-password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U notarx -d notarx"]
            initialDelaySeconds: 3
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      enableServiceLinks: false
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_ACCESS_KEY
              value: notarx-oidc-test-rustfs
            - name: RUSTFS_SECRET_KEY
              value: notarx-oidc-test-rustfs-password
            - name: RUSTFS_RPC_SECRET
              value: notarx-oidc-test-rustfs-rpc-secret
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notarx
spec:
  selector:
    app: notarx
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: notarx
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notarx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notarx
  template:
    metadata:
      labels:
        app: notarx
    spec:
      enableServiceLinks: false
      initContainers:
        - name: migrate
          image: postgres:18-alpine
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: notarx
            - name: PGUSER
              value: notarx
            - name: PGPASSWORD
              value: notarx-oidc-test-db-password
          command:
            - /bin/sh
            - /migrations/run-migrations.sh
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
        - name: wait-for-rustfs
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -ec
            - until curl --fail --silent http://rustfs:9000/health >/dev/null; do sleep 1; done
      containers:
        - name: notarx
          image: notarx:oidc-test
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: notarx-oidc-test-config
          env:
            - name: NOTARX_LISTEN_ADDRESS
              value: :8080
            - name: NOTARX_DATABASE_URL
              value: postgres://notarx:notarx-oidc-test-db-password@postgres:5432/notarx?sslmode=disable
            - name: NOTARX_OBJECT_STORE_ENDPOINT
              value: http://rustfs:9000
            - name: NOTARX_OBJECT_STORE_BUCKET
              value: notarx-cache
            - name: NOTARX_OBJECT_STORE_AUTO_CREATE_BUCKET
              value: "true"
            - name: NOTARX_OBJECT_STORE_ACCESS_KEY
              value: notarx-oidc-test-rustfs
            - name: NOTARX_OBJECT_STORE_SECRET_KEY
              value: notarx-oidc-test-rustfs-password
            - name: NOTARX_ADMIN_TOKEN
              value: notarx-oidc-test-admin-token
            - name: NOTARX_RESOLVER_TOKEN
              value: notarx-oidc-test-resolver-token
            - name: NOTARX_SETTINGS_ENCRYPTION_KEY
              value: 0123456789abcdef0123456789abcdef
            - name: NOTARX_OIDC_ISSUER
              value: http://127.0.0.1:8081/realms/notarx
            - name: NOTARX_OIDC_AUDIENCE
              value: notarx-api
            - name: NOTARX_OIDC_CLIENT_ID
              value: notarx-console
            - name: NOTARX_OIDC_SCOPES
              value: openid profile email
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 2
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0
          args: ["start-dev", "--import-realm", "--http-port=8081"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: notarx-oidc-test-keycloak-admin
            - name: KC_HOSTNAME
              value: http://127.0.0.1:8081
            - name: KC_HOSTNAME_STRICT
              value: "true"
          ports:
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 8
            periodSeconds: 3
          volumeMounts:
            - name: keycloak-realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: notarx-oidc-migrations
        - name: keycloak-realm
          configMap:
            name: notarx-oidc-keycloak-realm
