apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-gateway-config
data:
  NOTARX_LISTEN_ADDRESS: :8080
  NOTARX_NODE_ROLES: standalone
  NOTARX_DATABASE_MAX_OPEN_CONNS: "8"
  NOTARX_DATABASE_MAX_IDLE_CONNS: "4"
  NOTARX_DATABASE_COORDINATOR_MAX_OPEN_CONNS: "2"
  NOTARX_DATABASE_COORDINATOR_MAX_IDLE_CONNS: "1"
  NOTARX_DATABASE_ARTIFACT_LOCK_MAX_OPEN_CONNS: "2"
  NOTARX_DATABASE_ARTIFACT_LOCK_MAX_IDLE_CONNS: "1"
  NOTARX_OBJECT_STORE_ENDPOINT: http://rustfs:9000
  NOTARX_OBJECT_STORE_BUCKET: gateway-cache
  NOTARX_OBJECT_STORE_AUTO_CREATE_BUCKET: "true"
  NOTARX_APT_SIGNER_ENDPOINT: http://127.0.0.1:18083/v1/sign-release
  NOTARX_APT_SIGNER_TIMEOUT: 15s
  NOTARX_APT_SIGNER_TRUSTED_FINGERPRINTS: ""
  NOTARX_APT_SIGNER_TRUSTED_PUBLIC_KEYS_FILE: ""
  NO_PROXY: postgres,rustfs,notarx,artifact-gateway-console,127.0.0.1,localhost
