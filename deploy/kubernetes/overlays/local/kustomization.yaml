apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notarx-local
resources:
  - namespace.yaml
  - ../../base
  - config.yaml
  - infrastructure.yaml
  - ingress.yaml
patches:
  - path: notarx-patch.yaml
  - path: console-patch.yaml
images:
  - name: notarx
    newName: notarx
    newTag: k8s-local
  - name: notarx-console
    newName: notarx-console
    newTag: k8s-local
  - name: notarx-apt-signer
    newName: notarx-apt-signer
    newTag: k8s-local
