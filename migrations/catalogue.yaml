  audit_retention_policy:
    - enabled: "true"
      keep_days: "90"
      singleton: "true"
      version: "1"
  installation_repository_presets:
    - catalog_version: standard-v1
      groups_created: "0"
      repositories_created: "0"
      singleton: "true"
      state: pending
  public_access_policy:
    - enabled: "false"
      singleton: "true"
      version: "1"
  settings:
    - key: deployment_id
  site_settings:
    - brand_mark: NX
      default_theme_id: notarx-dark
      enabled_theme_ids: '["notarx-dark","notarx-light"]'
      logo_url: ""
      singleton: "true"
      site_name: notarx
      version: "1"
