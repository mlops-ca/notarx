# The dialect-neutral schema catalogue (ADR 0022, slice 3b).
#
# Generated from a migrated PostgreSQL with
#   go run ./tools/schemaparity generate
# and verified against PostgreSQL and MySQL with
#   make schema-parity
# Do not edit by hand. Column types are logical types (see internal/schemaparity/types.go):
# "?" marks a nullable column, "generated" a computed one. Plain secondary indexes are
# listed under "indexes"; every other index (partial, expression, trigram, operator class)
# under "special", and CHECK constraints under "checks", in their PostgreSQL form.
# The MySQL baseline migrations/mysql/000001_baseline.sql is generated from this file
# and migrations/mysql-decisions.yaml with: go run ./tools/mysqlbaseline
version: 1
tables:
  api_keys:
    columns:
      created_at: timestamp
      expires_at: timestamp?
      id: uuid
      last_used_at: timestamp?
      name: text
      revoked_at: timestamp?
      roles: array<text>
      secret_hash: text
      service_account_id: uuid?
    primaryKey: [id]
    unique: [[secret_hash]]
    foreignKeys:
      - service_account_id -> service_accounts(id)
    defaults:
      created_at: now()
    indexes:
      - service_account_id
    special:
      api_keys_active_expiry_idx: USING btree (expires_at) WHERE (revoked_at IS NULL)
      api_keys_service_account_idx: USING btree (service_account_id, id) WHERE (service_account_id IS NOT NULL)
    checks:
      api_keys_roles_check: (roles <@ ARRAY['member'::text, 'admin'::text])
  artifact_catalog:
    columns:
      coordinate: text
      format: text
      latest_digest: text
      latest_published_at: timestamp?
      latest_version: text
      publisher: text
      repository_id: uuid
      size_bytes: int64?
      version_count: int32
    primaryKey: [repository_id, format, coordinate]
    foreignKeys:
      - repository_id -> hosted_repositories(id)
    defaults:
      latest_digest: ''''''
      latest_version: ''''''
      publisher: ''''''
      version_count: "0"
    special:
      artifact_catalog_coordinate_trgm_idx: USING gin (coordinate gin_trgm_ops) WITH (fastupdate='on', gin_pending_list_limit='1024')
    checks:
      artifact_catalog_version_count_check: (version_count >= 0)
  artifact_catalog_backfill:
    columns:
      completed_at: timestamp?
      cursor_key: text
      cursor_repository_id: uuid
      format: text
      updated_at: timestamp
    primaryKey: [format]
    defaults:
      cursor_key: ''''''
      cursor_repository_id: '''00000000-0000-0000-0000-000000000000'''
      updated_at: now()
  artifact_intelligence:
    columns:
      body_digest: text?
      body_key: text?
      body_size: int64?
      coordinate: text
      created_at: timestamp
      digest: text
      format: text
      licenses: json
      provenance: json?
      repository_id: uuid
      sboms: json
      signatures: json
      updated_at: timestamp
      updated_by: text
      version: int64
      vulnerability: json?
    primaryKey: [repository_id, format, coordinate, digest]
    foreignKeys:
      - repository_id -> hosted_repositories(id) on delete cascade
    defaults:
      created_at: now()
      licenses: '''[]'''
      sboms: '''[]'''
      signatures: '''[]'''
      updated_at: now()
      updated_by: ''''''
      version: "1"
    indexes:
      - updated_at desc
    special:
      artifact_intelligence_body_key_idx: USING btree (body_key) WHERE (body_key IS NOT NULL)
    checks:
      artifact_intelligence_body_ref_check: (((body_digest IS NULL) AND (body_size IS NULL) AND (body_key IS NULL)) OR ((body_digest IS NOT NULL) AND (body_size IS NOT NULL) AND (body_key IS NOT NULL) AND (body_size >= 0)))
      artifact_intelligence_coordinate_check: ((char_length(coordinate) >= 1) AND (char_length(coordinate) <= 1024))
      artifact_intelligence_digest_check: (digest ~ '^sha256:[a-f0-9]{64}$'::text)
      artifact_intelligence_version_check: (version >= 1)
  artifact_license:
    columns:
      artifact_digest: text
      confidence: decimal
      repository_id: uuid
      source: text
      spdx_id: text
    primaryKey: [repository_id, artifact_digest, spdx_id, source]
    defaults:
      confidence: "1"
    checks:
      artifact_license_confidence_check: ((confidence >= (0)::numeric) AND (confidence <= (1)::numeric))
  artifact_quarantines:
    columns:
      coordinate: text
      digest: text
      format: text
      quarantined_at: timestamp
      reason: text
      released_at: timestamp?
      repository_id: uuid
      state: text
      updated_at: timestamp
      updated_by: text
      version: int64
    primaryKey: [repository_id, format, coordinate, digest]
    foreignKeys:
      - repository_id -> hosted_repositories(id) on delete cascade
    defaults:
      quarantined_at: now()
      updated_at: now()
      version: "1"
    checks:
      artifact_quarantines_check: (((state = 'quarantined'::text) AND (released_at IS NULL)) OR ((state = 'released'::text) AND (released_at IS NOT NULL)))
      artifact_quarantines_check1: ((format <> 'conan'::text) OR (coordinate ~ '^[^/#]+/[^/#]+/[^/#]+/[^/#]+#[^/#]+$'::text))
      artifact_quarantines_coordinate_check: ((char_length(coordinate) >= 1) AND (char_length(coordinate) <= 1024) AND (btrim(coordinate) <> ''::text))
      artifact_quarantines_digest_check: (digest ~ '^sha256:[a-f0-9]{64}$'::text)
      artifact_quarantines_format_check: (format = ANY (ARRAY['raw'::text, 'oci'::text, 'maven'::text, 'conan'::text, 'npm'::text, 'pypi'::text, 'go'::text, 'apt'::text, 'cargo'::text]))
      artifact_quarantines_reason_check: ((char_length(reason) >= 1) AND (char_length(reason) <= 1024) AND (btrim(reason) <> ''::text))
      artifact_quarantines_state_check: (state = ANY (ARRAY['quarantined'::text, 'released'::text]))
      artifact_quarantines_updated_by_check: ((char_length(updated_by) >= 1) AND (char_length(updated_by) <= 512) AND (btrim(updated_by) <> ''::text))
      artifact_quarantines_version_check: (version >= 1)
  artifact_sbom:
    columns:
      artifact_digest: text
      body: json?
      body_digest: text
      body_key: text
      body_size: int64
      component_count: int32
      created_at: timestamp
      generator: text
      generator_version: text
      id: uuid
      kind: text
      repository_id: uuid
      source: text
      spec_version: text
    primaryKey: [id]
    unique: [[repository_id, artifact_digest, kind, source]]
    defaults:
      body_key: ''''''
      component_count: "0"
      created_at: now()
      generator: ''''''
      generator_version: ''''''
      spec_version: ''''''
    special:
      artifact_sbom_body_key_idx: USING btree (body_key) WHERE (body_key <> ''::text)
    checks:
      artifact_sbom_body_check: ((body IS NOT NULL) OR (body_key <> ''::text))
      artifact_sbom_kind_check: ((kind)::text = ANY (ARRAY[('cyclonedx-json'::character varying)::text, ('spdx-json'::character varying)::text]))
      artifact_sbom_size_check: ((body_size >= 0) AND (component_count >= 0))
      artifact_sbom_source_check: ((source)::text = ANY (ARRAY[('generated'::character varying)::text, ('uploaded'::character varying)::text, ('promoted'::character varying)::text]))
  artifact_scan_history:
    columns:
      artifact_digest: text
      critical: int32
      db_generation_id: uuid?
      high: int32
      id: uuid
      low: int32
      medium: int32
      repository_id: uuid
      scanned_at: timestamp
      scanner_version: text
      status: text
      unknown: int32
    primaryKey: [scanned_at, id]
    partitioned: true
    defaults:
      critical: "0"
      high: "0"
      low: "0"
      medium: "0"
      scanner_version: ''''''
      unknown: "0"
    indexes:
      - repository_id,artifact_digest,scanned_at desc
  artifact_tombstones:
    columns:
      coordinate: text
      digest: text
      format: text
      repository_id: uuid
      tombstoned_at: timestamp
    primaryKey: [repository_id, format, coordinate]
    foreignKeys:
      - repository_id -> hosted_repositories(id)
    defaults:
      digest: ''''''
      tombstoned_at: now()
    indexes:
      - tombstoned_at
    checks:
      artifact_tombstones_format_check: (format = ANY (ARRAY['raw'::text, 'oci'::text, 'maven'::text, 'conan'::text, 'npm'::text, 'pypi'::text, 'go'::text, 'apt'::text, 'cargo'::text]))
  artifact_usage_stats:
    columns:
      download_count: int64
      first_downloaded_at: timestamp
      format: text
      last_actor: text
      last_downloaded_at: timestamp
      repository_id: uuid
      resource: text
      total_bytes: int64
    primaryKey: [repository_id, format, resource]
    defaults:
      download_count: "0"
      first_downloaded_at: now()
      last_actor: ''''''
      last_downloaded_at: now()
      total_bytes: "0"
    indexes:
      - repository_id,download_count desc
    special:
      artifact_usage_stats_repository_address_idx: USING btree (repository_id, resource COLLATE "C", format COLLATE "C")
  artifact_vulnerability:
    columns:
      artifact_digest: text
      critical: int32
      db_generation_id: uuid?
      findings_total: int32
      high: int32
      id: uuid
      low: int32
      medium: int32
      not_scanned_reason: text?
      repository_id: uuid
      scanned_at: timestamp
      scanner: text
      scanner_version: text
      status: text
      suppressed_count: int32
      truncated: bool
      unknown: int32
    primaryKey: [id]
    unique: [[repository_id, artifact_digest]]
    defaults:
      critical: "0"
      findings_total: "0"
      high: "0"
      low: "0"
      medium: "0"
      scanner_version: ''''''
      suppressed_count: "0"
      truncated: "false"
      unknown: "0"
    indexes:
      - db_generation_id,scanned_at,id
    checks:
      artifact_vulnerability_counts_check: ((critical >= 0) AND (high >= 0) AND (medium >= 0) AND (low >= 0) AND (unknown >= 0) AND (suppressed_count >= 0) AND (findings_total >= 0))
      artifact_vulnerability_status_check: ((status)::text = ANY (ARRAY[('clean'::character varying)::text, ('vulnerable'::character varying)::text, ('stale_db'::character varying)::text, ('not_scanned'::character varying)::text, ('error'::character varying)::text]))
  artifact_vulnerability_finding:
    columns:
      component: text
      cvss_score: decimal?
      cvss_vector: text
      description: text?
      epss: decimal?
      fixed_version: text
      kev: bool?
      location: text
      ordinal: int32
      severity: text
      severity_rank: int16
      source: text
      status: text
      title: text
      url: text
      version: text
      vex_justification: text?
      vex_status: text?
      vuln_id: text
      vulnerability_id: uuid
    primaryKey: [vulnerability_id, ordinal]
    defaults:
      component: ''''''
      cvss_vector: ''''''
      fixed_version: ''''''
      location: ''''''
      source: ''''''
      title: ''''''
      url: ''''''
      version: ''''''
    indexes:
      - vulnerability_id,severity_rank,vuln_id,ordinal
    checks:
      artifact_vulnerability_finding_severity_check: ((severity)::text = ANY (ARRAY[('critical'::character varying)::text, ('high'::character varying)::text, ('medium'::character varying)::text, ('low'::character varying)::text, ('unknown'::character varying)::text]))
      artifact_vulnerability_finding_status_check: ((status)::text = ANY (ARRAY[('affected'::character varying)::text, ('suppressed'::character varying)::text, ('fixed'::character varying)::text]))
  audit_cleanup_jobs:
    columns:
      batch_size: int32
      completed_at: timestamp?
      created_at: timestamp
      cutoff_at: timestamp
      deleted: int32
      id: uuid
      idempotency_key: text
      last_error: text
      policy_version: int64
      started_at: timestamp?
      state: text
    primaryKey: [id]
    unique: [[idempotency_key]]
    defaults:
      created_at: now()
      deleted: "0"
      last_error: ''''''
    special:
      audit_cleanup_jobs_claim_idx: USING btree (created_at) WHERE (state = ANY (ARRAY['pending'::text, 'failed'::text]))
      audit_cleanup_jobs_retention_idx: USING btree (completed_at) WHERE (state = ANY (ARRAY['completed'::text, 'failed'::text]))
      audit_cleanup_jobs_running_started_idx: USING btree (started_at) WHERE (state = 'running'::text)
    checks:
      audit_cleanup_jobs_batch_size_check: ((batch_size >= 1) AND (batch_size <= 50000))
      audit_cleanup_jobs_state_check: (state = ANY (ARRAY['pending'::text, 'running'::text, 'completed'::text, 'failed'::text]))
  audit_retention_policy:
    columns:
      enabled: bool
      keep_days: int32
      singleton: bool
      version: int64
    primaryKey: [singleton]
    defaults:
      enabled: "true"
      keep_days: "90"
      singleton: "true"
      version: "1"
    checks:
      audit_retention_policy_keep_days_check: (keep_days >= 0)
      audit_retention_policy_singleton_check: singleton
  authorization_roles:
    columns:
      created_at: timestamp
      description: text
      id: uuid
      name: text
      scopes: array<text>
      updated_at: timestamp
      version: int64
    primaryKey: [id]
    defaults:
      created_at: now()
      description: ''''''
      updated_at: now()
      version: "1"
    indexes:
      - updated_at desc,id desc
    special:
      authorization_roles_name_ci_idx: unique USING btree (lower(name))
    checks:
      authorization_roles_scopes_nonempty: (cardinality(scopes) > 0)
  authorization_templates:
    columns:
      created_at: timestamp
      description: text
      grants: json
      id: uuid
      name: text
      updated_at: timestamp
      version: int64
    primaryKey: [id]
    defaults:
      created_at: now()
      description: ''''''
      grants: '''[]'''
      updated_at: now()
      version: "1"
    indexes:
      - updated_at desc,id desc
    special:
      authorization_templates_name_ci_idx: unique USING btree (lower(name))
  cache_circuit_breakers:
    columns:
      expires_at: timestamp
      key: text
      updated_at: timestamp
    primaryKey: [key]
    defaults:
      updated_at: now()
    indexes:
      - expires_at
  cache_control_entries:
    columns:
      key: text
      updated_at: timestamp
      value: json
    primaryKey: [key]
    defaults:
      updated_at: now()
    special:
      cache_control_entries_key_prefix_idx: USING btree (key text_pattern_ops)
      cache_control_entries_proxy_browse_idx: USING btree (md5(COALESCE((value ->> 'repository'::text), (value ->> 'Repository'::text))), md5(COALESCE((value ->> 'endpoint'::text), (value ->> 'Endpoint'::text))), "left"(COALESCE((value ->> 'path'::text), (value ->> 'Path'::text)), 256) text_pattern_ops) WHERE ((key ~~ 'maven/index/%'::text) OR (key ~~ 'raw/index/%'::text))
  cache_tasks:
    columns:
      attempts: int32
      available_at: timestamp
      claim_token: uuid?
      claimed_at: timestamp?
      completed_at: timestamp?
      created_at: timestamp
      dedupe_key: text
      id: uuid
      task_type: text
    primaryKey: [id]
    defaults:
      attempts: "0"
      available_at: now()
      created_at: now()
    special:
      cache_tasks_active_dedupe_idx: unique USING btree (dedupe_key) WHERE (completed_at IS NULL)
      cache_tasks_claim_idx: USING btree (task_type, available_at, created_at) WHERE (completed_at IS NULL)
      cache_tasks_retention_idx: USING btree (completed_at) WHERE (completed_at IS NOT NULL)
    checks:
      cache_tasks_attempts_check: (attempts >= 0)
  conan_group_members:
    columns:
      allowed_hosts: array<text>
      endpoint: text
      group_name: text
      member_type: text
      name: text
      position: int32
      repository_id: uuid?
    primaryKey: [group_name, position]
    unique: [[group_name, name]]
    foreignKeys:
      - group_name -> conan_groups(name) on delete cascade
      - repository_id -> hosted_repositories(id)
    defaults:
      allowed_hosts: '''[]'''
    indexes:
      - repository_id
    special:
      conan_group_members_repository_id_idx: USING btree (repository_id) WHERE (repository_id IS NOT NULL)
    checks:
      conan_group_members_member_type_check: (member_type = ANY (ARRAY['hosted'::text, 'proxy'::text]))
      conan_group_members_position_check: ("position" >= 0)
      conan_group_proxy_allowlist_required: ((member_type <> 'proxy'::text) OR (cardinality(allowed_hosts) > 0))
  conan_groups:
    columns:
      anonymous: bool
      cache_quota_bytes: int64
      created_at: timestamp
      enabled: bool
      name: text
    primaryKey: [name]
    defaults:
      anonymous: "false"
      cache_quota_bytes: "1073741824"
      created_at: now()
      enabled: "true"
    checks:
      conan_groups_cache_quota_bytes_check: (cache_quota_bytes > 0)
  console_theme_packages:
    columns:
      created_at: timestamp
      id: text
      payload: json
      updated_at: timestamp
      version: int64
    primaryKey: [id]
    defaults:
      created_at: now()
      updated_at: now()
      version: "1"
    checks:
      console_theme_packages_id_valid: (id ~ '^[a-z0-9][a-z0-9-]{1,63}$'::text)
      console_theme_packages_payload_object: (jsonb_typeof(payload) = 'object'::text)
      console_theme_packages_version_check: (version > 0)
  email_targets:
    columns:
      created_at: timestamp
      enabled: bool
      id: uuid
      locale: text
      name: text
      recipient_ciphertext: text
      updated_at: timestamp
      version: int64
    primaryKey: [id]
    defaults:
      created_at: now()
      enabled: "false"
      locale: '''en-CA'''
      updated_at: now()
      version: "1"
    checks:
      email_targets_locale_check: (locale = ANY (ARRAY['en-CA'::text, 'fr-CA'::text, 'zh-CN'::text]))
      email_targets_name_check: ((length(name) >= 1) AND (length(name) <= 128))
  email_test_deliveries:
    columns:
      accepted_at: timestamp?
      attempts: int32
      automatic_cancellation_code: text
      console_origin: text
      created_at: timestamp
      episode_id: uuid?
      error_code: text
      event_id: uuid
      event_sequence: int64?
      from_address: text
      id: uuid
      kind: text
      lease_expires_at: timestamp?
      lease_owner: text
      lease_token: uuid?
      locale: text
      next_attempt_at: timestamp
      possible_duplicate: bool
      quota_descriptor: json?
      quota_rule_id: uuid?
      recipient_ciphertext: text
      request_key: uuid
      scenario: text
      state: text
      target_id: uuid
      target_version: int64
      template_version: text
      updated_at: timestamp
      version: int64
    primaryKey: [id]
    unique: [[event_id], [request_key]]
    foreignKeys:
      - quota_rule_id -> repository_quota_alert_rules(id)
      - target_id -> email_targets(id)
    defaults:
      attempts: "0"
      automatic_cancellation_code: ''''''
      created_at: now()
      error_code: ''''''
      kind: '''test'''
      lease_owner: ''''''
      locale: '''en-CA'''
      next_attempt_at: now()
      possible_duplicate: "false"
      state: '''pending'''
      updated_at: now()
      version: "1"
    indexes:
      - quota_rule_id
      - target_id
    special:
      email_quota_order: USING btree (quota_rule_id, event_sequence) WHERE (kind = 'repository_quota'::text)
      email_test_deliveries_retention_idx: USING btree (updated_at) WHERE (state = ANY (ARRAY['accepted'::text, 'dead'::text]))
      email_test_delivery_due: USING btree (next_attempt_at) WHERE (state = ANY (ARRAY['pending'::text, 'retrying'::text, 'delivering'::text]))
    checks:
      email_quota_descriptor_shape: (((kind = 'test'::text) AND (quota_rule_id IS NULL) AND (episode_id IS NULL) AND (event_sequence IS NULL) AND (quota_descriptor IS NULL)) OR ((kind = 'repository_quota'::text) AND (quota_rule_id IS NOT NULL) AND (episode_id IS NOT NULL) AND (event_sequence > 0) AND (quota_descriptor IS NOT NULL) AND (octet_length((quota_descriptor)::text) <= 8192)))
      email_quota_sequence_required: ((kind <> 'repository_quota'::text) OR (event_sequence IS NOT NULL))
      email_test_deliveries_attempts_check: ((attempts >= 0) AND (attempts <= 8))
      email_test_deliveries_automatic_cancellation_code_check: (automatic_cancellation_code = ANY (ARRAY[''::text, 'rule_changed'::text, 'rule_disabled'::text, 'rule_deleted'::text]))
      email_test_deliveries_kind_check: (kind = ANY (ARRAY['test'::text, 'repository_quota'::text]))
      email_test_deliveries_locale_check: (locale = ANY (ARRAY['en-CA'::text, 'fr-CA'::text, 'zh-CN'::text]))
      email_test_deliveries_scenario_check: (scenario = ANY (ARRAY['warning'::text, 'critical'::text, 'resolved'::text]))
      email_test_deliveries_state_check: (state = ANY (ARRAY['pending'::text, 'delivering'::text, 'retrying'::text, 'accepted'::text, 'dead'::text]))
  email_test_requests:
    columns:
      created_at: timestamp
      id: int64
    primaryKey: [id]
    defaults:
      created_at: now()
      id: identity
    indexes:
      - created_at
  hf_blobs:
    columns:
      created_at: timestamp
      hf_repo_id: uuid
      sha256: text
      size: int64
    primaryKey: [hf_repo_id, sha256]
    foreignKeys:
      - hf_repo_id -> hf_repos(id) on delete cascade
    defaults:
      created_at: now()
    indexes:
      - sha256
    checks:
      hf_blobs_sha256_check: (sha256 ~ '^[0-9a-f]{64}$'::text)
      hf_blobs_size_check: (size >= 0)
  hf_commits:
    columns:
      author: text?
      commit_sha: text
      committed_at: timestamp
      file_count: int32?
      hf_repo_id: uuid
      id: uuid
      last_read_at: timestamp
      message: text?
      parent_sha: text?
      source: text
      total_bytes: int64?
    primaryKey: [id]
    unique: [[hf_repo_id, commit_sha]]
    foreignKeys:
      - hf_repo_id -> hf_repos(id) on delete cascade
    defaults:
      last_read_at: now()
    indexes:
      - hf_repo_id,committed_at desc,id desc
      - last_read_at
    checks:
      hf_commits_counts_check: (((file_count IS NULL) OR (file_count >= 0)) AND ((total_bytes IS NULL) OR (total_bytes >= 0)))
      hf_commits_parent_check: ((parent_sha IS NULL) OR (parent_sha ~ '^[0-9a-f]{40}$'::text))
      hf_commits_sha_check: (commit_sha ~ '^[0-9a-f]{40}$'::text)
      hf_commits_source_check: ((source)::text = ANY (ARRAY['upstream'::text, 'hosted'::text, 'promoted'::text]))
  hf_files:
    columns:
      cached: bool
      commit_id: uuid
      git_blob_id: text?
      lfs: bool
      path: text
      pickle_flag: bool
      sha256: text?
      size: int64
    primaryKey: [commit_id, path]
    foreignKeys:
      - commit_id -> hf_commits(id) on delete cascade
    defaults:
      cached: "false"
      lfs: "false"
      pickle_flag: "false"
    indexes:
      - sha256
    checks:
      hf_files_sha256_check: ((sha256 IS NULL) OR (sha256 ~ '^[0-9a-f]{64}$'::text))
      hf_files_size_check: (size >= 0)
  hf_refs:
    columns:
      checked_at: timestamp
      commit_sha: text
      expires_at: timestamp
      hf_repo_id: uuid
      ref_kind: text
      ref_name: text
    primaryKey: [hf_repo_id, ref_kind, ref_name]
    foreignKeys:
      - hf_repo_id -> hf_repos(id) on delete cascade
    indexes:
      - expires_at
    checks:
      hf_refs_kind_check: ((ref_kind)::text = ANY (ARRAY['branch'::text, 'tag'::text]))
