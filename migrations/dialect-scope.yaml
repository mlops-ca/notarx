# Migrations after the baseline that ship for one dialect only (ADR 0022).
#
# Every migration from 000002 on either exists in migrations/postgres and migrations/mysql, or is
# named here with the one dialect it applies to and why. make test fails otherwise
# (internal/schemaparity, TestRepositoryMigrationsShipInEveryDialectOrAreNamed).
#
# These files were written before the MySQL baseline exists. The MySQL baseline (slice 3c) is
# generated from the neutral catalogue (migrations/catalogue.yaml), which is taken after all of
# them, so MySQL starts with their schema effects and never replays them.
version: 1
migrations:
  000002_native_npm_versions_object_key_index.sql:
    dialect: postgres
    reason: partial index; MySQL gets a generated-column index in the slice 3c baseline
  000003_artifact_catalog.sql:
    dialect: postgres
    reason: creates the artifact_catalog table, which the catalogue carries into the MySQL baseline, and a trigram index MySQL does not have
  000004_quota_evaluation_wakeup.sql:
    dialect: postgres
    reason: LISTEN/NOTIFY trigger for the quota evaluator; MySQL polls instead
  000005_keyset_listing_indexes.sql:
    dialect: postgres
    reason: PostgreSQL index definitions (descending order, COLLATE "C"); the slice 3c baseline declares the MySQL equivalents
  000006_read_cache_invalidation_triggers.sql:
    dialect: postgres
    reason: NOTIFY triggers for cache invalidation; MySQL polls cache_epochs instead
  000007_read_cache_account_state.sql:
    dialect: postgres
    reason: NOTIFY triggers for cache invalidation; MySQL polls cache_epochs instead
  000008_externalize_payload_constraints.sql:
    dialect: postgres
    reason: PostgreSQL CHECK constraint rewrites; the slice 3c baseline declares the MySQL constraints
  000009_repository_grants_principal_index.sql:
    dialect: postgres
    reason: partial index; MySQL gets a generated-column index in the slice 3c baseline
  000010_read_cache_statement_notifications.sql:
    dialect: postgres
    reason: statement-level NOTIFY triggers; MySQL polls cache_epochs instead
  000011_read_cache_statement_notifications_accounts.sql:
    dialect: postgres
    reason: statement-level NOTIFY triggers; MySQL polls cache_epochs instead
  000012_meta_object_sweep.sql:
    dialect: postgres
    reason: creates meta_object_pins, which the catalogue carries into the MySQL baseline
  000013_raw_versioned_layout.sql:
    dialect: postgres
    reason: adds the Raw layout columns, the version and property tables and the internal lease kind of scheduled_tasks with PostgreSQL constraint rewrites; the catalogue carries the schema into the slice 3c MySQL baseline
  000014_huggingface_repositories.sql:
    dialect: postgres
    reason: extends the repository and group format checks and creates the hf_* tables with PostgreSQL constraint rewrites; the catalogue carries the schema into the MySQL baseline
  000015_user_groups.sql:
    dialect: postgres
    reason: creates user_groups and user_group_members with partial and expression unique indexes and statement-level NOTIFY triggers; the catalogue carries the tables into the MySQL baseline, which polls cache_epochs instead
  000016_service_account_assertions.sql:
    dialect: postgres
    reason: creates the assertion audience and subject tables, adds service_accounts.assertion_subject and backfills subjects with a regular expression; the catalogue carries the schema into the MySQL baseline
  000017_scim_tokens.sql:
    dialect: postgres
    reason: creates identity_provider_scim_tokens and two keyset indexes for the SCIM lists; the catalogue carries them into the MySQL baseline
  000018_scim_auth_cache_notifications.sql:
    dialect: postgres
    reason: statement-level NOTIFY triggers on the SCIM token and identity provider tables; MySQL polls cache_epochs instead
  000019_workload_replication_actor.sql:
    dialect: postgres
    reason: rewrites the actor_kind checks of the Helm, NuGet and RubyGems replication jobs; the catalogue carries the checks into the MySQL baseline
  000020_domain_events.sql:
    dialect: postgres
    reason: creates the range-partitioned domain_events table and its partition manager registration, the emit_domain_event function and the Cargo trigger bodies, and drops webhook_events; the catalogue carries domain_events into the MySQL baseline as a plain table pruned by the retention janitor
  000021_domain_events_emit_once.sql:
    dialect: postgres
    reason: adds the emit_domain_event_once function, the advisory-locked and retention-floor-aware insert of the catch-up reconciler, next to emit_domain_event; the MySQL baseline carries tables only
  000022_artifact_promotions.sql:
    dialect: postgres
    reason: creates artifact_promotions with a partial index, the chain_path append-only trigger and the promotion job state trigger that replaces the Cargo-only one; the catalogue carries the table into the MySQL baseline with a generated-column index for the pending states, and the MySQL lifecycle store ports the triggers
  000023_remote_instances.sql:
    dialect: postgres
    reason: creates remote_instances and instance_identity with a byte-order name index; the catalogue carries both tables into the MySQL baseline
  000024_promotion_rules.sql:
    dialect: postgres
    reason: creates promotion_rules with a byte-order name index; the catalogue carries the table into the MySQL baseline
