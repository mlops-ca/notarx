name: Bug report
description: Behaviour differs from what is expected or from the contract
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing. After creating the issue, add an `area:*` label (and `format:*` when it applies). Title it `<area>: <outcome statement>` (example: `Console: the audit strip counts only the loaded page`).
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What actually happened. Paste redacted error text, audit operation codes or request IDs when you have them.
      placeholder: |
        Actual behaviour:
        Error / audit operation code / requestId:
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour and contract evidence
      description: The behaviour you expect and what says it should work that way (the `api/openapi` contract, docs or existing behaviour).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or commands; for formats and protocols give the repository and artifact coordinates.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version and deployment shape. The server version is in the build information under Console, Operations, System diagnostics.
      placeholder: |
        Server version / revision:
        Console version (if any):
        Deployment shape (compose / k8s / standalone):
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected, the scope of the change and explicit exclusions; whether it blocks a release or automation, and any workaround.
    validations:
      required: true
