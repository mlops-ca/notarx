name: Design issue
description: A decision issue whose outcome is a conclusion or an ADR
labels: ["type: design"]
body:
  - type: markdown
    attributes:
      value: |
        The outcome of a design issue is a decision and where it is recorded, not code; open a separate `type: feature` issue for the implementation. After creating the issue, add an `area:*` label.
  - type: textarea
    id: problem
    attributes:
      label: Problem and constraints
      description: What must be decided, the scope and explicit exclusions, and the constraints (compatibility, data reality, deployment shape).
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
      description: At least two options, with the cost and benefit of each.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision points
      description: Who has to decide what; record the conclusion in this issue once it is made.
    validations:
      required: true
  - type: textarea
    id: record
    attributes:
      label: Where the conclusion is recorded
      description: The ADR number (`docs/adr/`) or document path; if there is none, say the conclusion stays in the issue.
    validations:
      required: false
