name: Feature request
description: Add or extend a user-visible capability
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        After creating the issue, add an `area:*` label (and `format:*` when it applies) and title it `<area>: <outcome statement>`. For a series, create an overview issue and list the children as a task list in its body.
  - type: textarea
    id: background
    attributes:
      label: Background and current state
      description: How it works today and why that is not enough; cite the relevant code paths, contract or documents.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to build, as separate deliverables that can each be verified.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Executable acceptance conditions (tests, commands, screenshots or contract assertions).
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What is explicitly excluded, so review does not have to re-confirm it.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and ordering
      description: Issues this depends on, ordering against other issues, and conflict notes for shared files.
    validations:
      required: false
