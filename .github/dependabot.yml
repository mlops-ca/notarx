version: 2
# One grouped pull request per ecosystem and update class, opened on Mondays and
# capped at two open per ecosystem, so a dependency sweep cannot starve the
# batch pull requests of CI runners (docs/ci.md, "Dependency updates").
# Titles must satisfy .github/commit-policy.json (ADR 0024); the prefix below is
# the whole "type(scope)" part, so no scope is derived from the directory.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      gomod-root-minor-patch:
        update-types: [minor, patch]
      gomod-root-major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-console-minor-patch:
        update-types: [minor, patch]
      npm-console-major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /tools/openapi
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-tools-openapi-minor-patch:
        update-types: [minor, patch]
      npm-tools-openapi-major:
        update-types: [major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-root-minor-patch:
        update-types: [minor, patch]
      docker-root-major:
        update-types: [major]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      docker_compose-root-minor-patch:
        update-types: [minor, patch]
      docker_compose-root-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    groups:
      github_actions-root-minor-patch:
        update-types: [minor, patch]
      github_actions-root-major:
        update-types: [major]
