name: Test suite

# The one definition of the project's test jobs. Pull request CI (ci.yml) calls it
# with the classes the change touched; the release gates (release.yml, ADR 0024
# amended 2026-11-19) call it with every class on the planned commit. Pushes to main
# run no tests.
on:
  workflow_call:
    inputs:
      # Commit to test. Empty means the ref of the calling workflow.
      sha:
        default: ""
        type: string
      # pull-request or mainline: which arm64 legs of the contract lanes run.
      scope:
        default: mainline
        type: string
      # Change classes (scripts/ci-changes.sh).
      go:
        default: true
        type: boolean
      console:
        default: true
        type: boolean
      docs:
        default: true
        type: boolean
      images:
        default: true
        type: boolean
      # Architecture-sensitive change (the arm64 class of scripts/ci-changes.sh): the
      # arm64 contract lanes and arm64 lint run only when it is on. The release gates
      # leave it on, and the mainline scope refuses it off (ADR 0016, amendment of
      # 2026-11-19).
      arm64:
        default: true
        type: boolean
      # Console E2E spec selection (scripts/ci-e2e-select.sh); empty runs every spec.
      e2e_specs:
        default: ""
        type: string

permissions:
  contents: read

env:
  # Fall through to the origin on any proxy failure (a "|" separator, unlike
  # ",", also covers stream errors, not only 404/410).
  GOPROXY: https://proxy.golang.org|direct

jobs:
  docs:
    if: inputs.docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Documentation i18n twins
        run: node scripts/docs-i18n-check.mjs
      - name: Documentation links
        run: node scripts/docs-link-check.mjs
      - name: Documentation capability claims
        run: sh scripts/docs-capability-check.sh

  # The image Dockerfiles carry an opt-in test stage that image builds skip;
  # build it when the Dockerfiles or compose files changed so it cannot rot.
  image-test-stages:
    if: inputs.images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - run: make docker-test

  # Builds the Compose images CI consumes once per run. Contract lanes and the
  # Console E2E against notarx load them instead of each rebuilding from source
  # (docs/ci.md). Each architecture is its own job, native to its runner (ADR 0016):
  # amd64 images build on ubuntu-24.04 and arm64 images on ubuntu-24.04-arm, so an
  # amd64 job waits only for the amd64 images. One job builds both images of its
  # architecture in parallel (.github/actions/ci-images), and the artifact name
  # carries the runner architecture so the two sets never clash.
  build-images-amd64:
    if: inputs.go || inputs.console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/ci-images

  build-images-arm64:
    if: inputs.go || inputs.console
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/ci-images

  # The lane plan (scripts/ci-contract-lanes.json) is the single source for
  # lane names, tool needs and timeouts; the matrix below is generated from it.
  contract-plan:
    if: inputs.go
    runs-on: ubuntu-24.04
    outputs:
      early: ${{ steps.plan.outputs.early }}
      early-jobs: ${{ steps.plan.outputs.early-jobs }}
      amd64: ${{ steps.plan.outputs.amd64 }}
      amd64-jobs: ${{ steps.plan.outputs.amd64-jobs }}
      arm64: ${{ steps.plan.outputs.arm64 }}
      arm64-jobs: ${{ steps.plan.outputs.arm64-jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      # Every lane runs on amd64. The arm64 legs (ADR 0016) are the core lanes and the
      # native-format smoke subset for an architecture-sensitive pull request, none for
      # any other pull request, and every lane for the mainline scope the release gates
      # use (the tiers live in scripts/ci-contract-lanes.json). The plan is split in
      # three groups so each job waits only for the images it loads: early (lanes
      # that load no prebuilt image, both architectures), amd64 and arm64.
      - id: plan
        env:
          SCOPE: ${{ inputs.scope }}
          ARM64: ${{ inputs.arm64 }}
        run: |
          args=(--scope "$SCOPE")
          if [[ "$ARM64" != true ]]; then args+=(--no-arm64); fi
          for group in early amd64 arm64; do
            matrix=$(python3 scripts/ci-contract.py matrix "${args[@]}" --group "$group")
            echo "$group=$matrix" >> "$GITHUB_OUTPUT"
            echo "$group-jobs=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          done

  # Lanes that load no prebuilt image start as soon as the plan exists.
  contract-early:
    needs: contract-plan
    if: needs.contract-plan.outputs.early-jobs != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract-plan.outputs.early) }}
    uses: ./.github/workflows/contract-lane.yml
    with:
      job: ${{ matrix.job }}
      lanes: ${{ matrix.lanes }}
      timeout: ${{ matrix.timeout }}
      images: ${{ matrix.images }}
      rust: ${{ matrix.rust }}
      node: ${{ matrix.node }}
      npm: ${{ matrix.npm }}
      runner: ${{ matrix.runner }}
      sha: ${{ inputs.sha }}

  contract-amd64:
    needs: [contract-plan, build-images-amd64]
    if: needs.contract-plan.outputs.amd64-jobs != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract-plan.outputs.amd64) }}
    uses: ./.github/workflows/contract-lane.yml
    with:
      job: ${{ matrix.job }}
      lanes: ${{ matrix.lanes }}
      timeout: ${{ matrix.timeout }}
      images: ${{ matrix.images }}
      rust: ${{ matrix.rust }}
      node: ${{ matrix.node }}
      npm: ${{ matrix.npm }}
      runner: ${{ matrix.runner }}
      sha: ${{ inputs.sha }}

  contract-arm64:
    needs: [contract-plan, build-images-arm64]
    if: needs.contract-plan.outputs.arm64-jobs != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract-plan.outputs.arm64) }}
    uses: ./.github/workflows/contract-lane.yml
    with:
      job: ${{ matrix.job }}
      lanes: ${{ matrix.lanes }}
      timeout: ${{ matrix.timeout }}
      images: ${{ matrix.images }}
      rust: ${{ matrix.rust }}
      node: ${{ matrix.node }}
      npm: ${{ matrix.npm }}
      runner: ${{ matrix.runner }}
      sha: ${{ inputs.sha }}

  # The shared object store contract against each supported S3-compatible service
  # (ADR 0017: RustFS and a second implementation). Runs with the Go class; needs no built images.
  object-store-contract:
    if: inputs.go
    uses: ./.github/workflows/object-store-contract.yml
    with:
      sha: ${{ inputs.sha }}

  # One definition of the Go checks for both architectures: the composite action
  # holds setup, lint, vet and race. On amd64 the work is split so the unit tests run
  # once and a fast signal arrives early: `lint` runs lint, vet and the
  # architecture-independent checks (native-build rules, migrations, release and
  # packaging checks, SAML fuzzing, dependency audit); `quality` runs the unit tests
  # once, with the race detector and -coverprofile, and enforces every coverage floor
  # from that one profile (make race-coverage). quality-arm64 runs vet and race on arm64
  # for every Go change and lint too for an architecture-sensitive one or in the release
  # gates (ADR 0016); make test runs on arm64 in the core lanes of the contract matrix.
  # The release, packaging and SAML fuzz checks run in release-checks, so neither
  # verdict waits for them (docs/ci.md).
  lint:
    if: inputs.go
    runs-on: ubuntu-24.04
    # Steps inside the composite action cannot set their own timeout, so the job
    # carries one (the npm installs used to be capped at 10 minutes each).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # migration-check compares migrations with the latest stable tag.
          fetch-depth: 0
      - name: Verify public npm lockfile sources
        run: node scripts/npm-lockfile-check.mjs
      - uses: ./.github/actions/go-quality
        with:
          race: "false"
          # The lint tools' own tests run in the quality job with every other package.
          lint-target: lint-checks
      - name: Verify the native-build rules (no cross-compilation, no emulation)
        run: make native-build-check
      - name: Check migration immutability and sequencing
        run: make migration-check
      - name: Audit dependencies
        run: make dependency-audit

  quality:
    if: inputs.go
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/go-quality
        with:
          lint: "false"
          vet: "false"
          race: "false"
          race-coverage: "true"

  # The architecture-independent release, packaging and SAML fuzz checks. They used to
  # follow lint in the lint job and held its verdict back by about 2.5 minutes, and
  # after the unit tests in quality they made that job the slowest of the suite; on
  # their own they finish long before the contract lanes (docs/ci.md, issue #500).
  release-checks:
    if: inputs.go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Node runs the prune-ghcr and release manifest tests; stamp-version-test needs
      # the OpenAPI tools.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json
      - name: Verify public npm lockfile sources before install
        run: node scripts/npm-lockfile-check.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
        timeout-minutes: 10
        working-directory: tools/openapi
      - name: Cache the pinned git-cliff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/notarx/git-cliff
          key: git-cliff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/git-cliff.version', 'scripts/install-git-cliff.sh') }}
      - name: Verify release version and artifact builder
        run: make release-version-check stamp-version-test release-pipeline-test release-workflow-check release-artifacts-test
      - name: Verify the release plan against the pinned git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-plan-test
      - name: Verify package signing runbook and environment checks
        run: make packages-signing-drill packages-environments-test
      - name: Fuzz the SAML response verifier (60s, committed corpus)
        run: make saml-fuzz

  # vet and the race detector run natively on arm64 for every Go change; lint (whose
  # result differs only by architecture build constraints) runs on arm64 when the
  # change is architecture-sensitive and in the release gates (ADR 0016, amendment of
  # 2026-11-19).
  quality-arm64:
    if: inputs.go
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: ./.github/actions/go-quality
        with:
          lint: ${{ inputs.arm64 }}

  console:
    if: inputs.console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Verify public npm lockfile sources
        run: node scripts/npm-lockfile-check.mjs
      - run: npm ci --timing --loglevel=http
        timeout-minutes: 10
        working-directory: console
      - name: Check generated API client
        run: make console-api-check
      - name: Type check console
        run: make console-typecheck
      - name: Lint and check Console formatting
        run: make console-check
      - name: Run Console unit tests
        run: make console-test
      - name: Build console
        run: make console-build
      - name: Build Console deployment image
        run: make console-docker-build
      - name: Install browser
        uses: ./.github/actions/playwright-browser
      - name: Verify built Console identity
        run: npx playwright test --config playwright.build.config.ts
        working-directory: console
      - name: Compare Console visual baseline
        run: make console-visual
      - name: Upload Console visual diff
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-visual-diff
          path: console/test-results/
          retention-days: 7

  # notarx-backed Console and CLI E2E: runs when notarx or the Console
  # changed, since both execute the real stack. The Playwright suite is split
  # into three parallel shards (every spec lands in exactly one); the shard marked
  # cli also runs the CLI E2E, against a gateway of its own, after its specs. A
  # console-only change that touches nothing but spec files runs just those specs
  # (docs/ci.md).
  console-e2e:
    name: console-e2e (${{ matrix.name }})
    needs: build-images-amd64
    if: inputs.go || inputs.console
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each entry names its own shard fraction, so the total cannot drift
        # from the list. Add or remove entries to change the shard count. Exactly one
        # entry runs the CLI E2E (cli: true) after its specs, so it needs no job of
        # its own.
        include:
          - { name: '1', shard: 1/3, cli: false }
          - { name: '2', shard: 2/3, cli: true }
          - { name: '3', shard: 3/3, cli: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Verify public npm lockfile sources before install
        run: node scripts/npm-lockfile-check.mjs
      - run: npm ci --timing --loglevel=http
        timeout-minutes: 10
        working-directory: console
      - name: Install browser
        uses: ./.github/actions/playwright-browser
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ runner.arch }}
          path: ${{ runner.temp }}/images
      - name: Load the prebuilt images
        id: load-images
        run: for image in "$RUNNER_TEMP"/images/*.tar; do docker load --input "$image"; done
      - name: Start notarx for Console E2E
        env:
          NOTARX_ENV_FILE: ${{ runner.temp }}/notarx.env
        run: |
          cat > "$NOTARX_ENV_FILE" <<'EOF'
          NOTARX_HTTP_PORT=18080
          NOTARX_POSTGRES_PASSWORD=ci-postgres-password
          NOTARX_ADMIN_TOKEN=ci-admin-token
          NOTARX_RESOLVER_TOKEN=ci-resolver-token
          RUSTFS_ACCESS_KEY=ci-rustfs-user
          RUSTFS_SECRET_KEY=ci-rustfs-password
          RUSTFS_RPC_SECRET=ci-rustfs-independent-rpc-secret-0001
          RUSTFS_API_PORT=19000
          RUSTFS_CONSOLE_PORT=19001
          NOTARX_OIDC_ISSUER=http://127.0.0.1:1/ci-cli-e2e
          NOTARX_OIDC_AUDIENCE=ci-cli-e2e
          NOTARX_OIDC_JWKS_URL=http://127.0.0.1:1/ci-cli-e2e/jwks
          EOF
          docker compose --env-file "$NOTARX_ENV_FILE" -f compose.yml up --no-build --wait --remove-orphans
      - name: Run console E2E shard ${{ matrix.shard }}
        id: console-e2e
        env:
          NOTARX_ENV_FILE: ${{ runner.temp }}/notarx.env
          PLAYWRIGHT_BLOB_REPORT: '1'
          CONSOLE_E2E_SPECS: ${{ inputs.e2e_specs }}
          CONSOLE_E2E_SHARD: ${{ matrix.shard }}
        run: make console-e2e
      - name: Upload Console E2E blob report
        if: ${{ !cancelled() && (steps.console-e2e.outcome == 'success' || steps.console-e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-blob-${{ matrix.name }}
          path: console/blob-report/
          retention-days: 7
          # A shard that a spec selection leaves empty writes no blob.
          if-no-files-found: ignore
      - name: Upload Console E2E traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-traces-${{ matrix.name }}
          path: console/test-results/
          retention-days: 7
          if-no-files-found: ignore
      # The CLI E2E boots its own isolated gateway from the loaded images (a Compose
      # project of its own on free ports), so the state the specs of this shard left
      # behind cannot reach it. It runs even when a spec failed, so both verdicts show,
      # but not without the loaded images it starts from.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: ${{ !cancelled() && matrix.cli && steps.load-images.outcome == 'success' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Run notarxctl CLI E2E against its own gateway
        if: ${{ !cancelled() && matrix.cli && steps.load-images.outcome == 'success' }}
        env:
          NOTARX_ENV_FILE: ${{ runner.temp }}/notarx.env
          NOTARX_COMPOSE_BUILD_FLAG: --no-build
        run: make cli-e2e
      - name: Stop notarx after Console E2E
        if: always()
        env:
          NOTARX_ENV_FILE: ${{ runner.temp }}/notarx.env
        run: |
          if [ -f "$NOTARX_ENV_FILE" ]; then
            docker compose --env-file "$NOTARX_ENV_FILE" -f compose.yml down -v --remove-orphans
          else
            echo "Gateway environment file was not created; nothing to clean up."
          fi

  # Merges the shard blob reports into one HTML report (traces included). Runs
  # when every shard passed; a failed shard already fails the gate and uploads
  # its own blob report and traces.
  console-e2e-report:
    needs: console-e2e
    if: needs.console-e2e.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Verify public npm lockfile sources before install
        run: node scripts/npm-lockfile-check.mjs
      - run: npm ci --timing --loglevel=http
        timeout-minutes: 10
        working-directory: console
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: console-e2e-blob-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true
      - name: Merge shard reports
        run: npx playwright merge-reports --reporter html "$RUNNER_TEMP/blob-reports"
        working-directory: console
      - name: Upload merged Console E2E report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-report
          path: console/playwright-report/
          retention-days: 7
          if-no-files-found: error

  # Passes when every job succeeded or was skipped by change detection, fails on
  # any failure or cancellation.
  suite-ok:
    if: always()
    needs: [docs, image-test-stages, build-images-amd64, build-images-arm64, object-store-contract, contract-plan, contract-early, contract-amd64, contract-arm64, lint, quality, release-checks, quality-arm64, console, console-e2e, console-e2e-report]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          GO: ${{ inputs.go }}
          CONSOLE: ${{ inputs.console }}
          DOCS: ${{ inputs.docs }}
          IMAGES: ${{ inputs.images }}
          # Jobs per contract group (scripts/ci-contract.py matrix --group); a group
          # without a job is skipped by design.
          EARLY_JOBS: ${{ needs.contract-plan.outputs.early-jobs }}
          AMD64_JOBS: ${{ needs.contract-plan.outputs.amd64-jobs }}
          ARM64_JOBS: ${{ needs.contract-plan.outputs.arm64-jobs }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | select(.result != "success" and .result != "skipped")] | length == 0' >/dev/null
          # A skip is legitimate only when change detection turned the job off;
          # a job skipped because something upstream failed must not pass.
          e2e=false
          if [[ "$GO" == true || "$CONSOLE" == true ]]; then e2e=true; fi
          # The merged report is required whenever the shards all passed; when a
          # shard failed, that failure already fails the gate.
          report=false
          if [[ "$e2e" == true && $(echo "$NEEDS" | jq -r '.["console-e2e"].result') == success ]]; then report=true; fi
          # A contract group is required when the plan gave it a job. With the Go class
          # on, the plan must have run; an empty count then means it failed, which the
          # contract-plan check already reports.
          group() { if [[ "$GO" == true && "${1:-0}" != 0 ]]; then echo true; else echo false; fi; }
          early=$(group "$EARLY_JOBS") amd64=$(group "$AMD64_JOBS") arm64=$(group "$ARM64_JOBS")
          status=0
          for pair in lint:$GO quality:$GO release-checks:$GO quality-arm64:$GO object-store-contract:$GO contract-plan:$GO contract-early:$early contract-amd64:$amd64 contract-arm64:$arm64 console:$CONSOLE console-e2e:$e2e console-e2e-report:$report build-images-amd64:$e2e build-images-arm64:$e2e docs:$DOCS image-test-stages:$IMAGES; do
            job=${pair%%:*} class=${pair##*:}
            result=$(echo "$NEEDS" | jq -r --arg job "$job" '.[$job].result')
            if [[ "$class" == true && "$result" != success ]]; then
              echo "::error::$job was required by change detection but its result is $result"
              status=1
            fi
          done
          exit $status
