name: i18n-review

# The automated fr-CA review (ADR 0014, "Translation workflow", slice 13). It
# runs on pull requests that touch fr-CA strings, fr-CA documents or the
# glossary, asks the configured provider to review only the changed strings (or
# the prose of the changed fr-CA documents) against the glossary and the writing
# rules, and fails when a critical key has a finding. Keys that pass are
# recorded "reviewed" in console/src/messages/.review/fr-CA.json. No human
# Quebec reviewer is required; a maintainer approves the pull request
# (.github/CODEOWNERS).
#
# Repository variable I18N_REVIEW_PROVIDER selects anthropic, mistral or cohere;
# the matching API key is an Actions secret (ANTHROPIC_API_KEY, MISTRAL_API_KEY,
# COHERE_API_KEY). Fork pull requests get no secrets, so a maintainer runs this
# workflow with workflow_dispatch against the pull request number; the result is
# then posted as a commit status on the pull request head.
#
# The script that holds the secret is the copy from the pull request's base
# revision. The head is only read as data (the dictionaries and documents), never
# executed, so a pull request cannot change the script to leak the key.
on:
  pull_request:
    paths:
      - '**/*.fr-CA.ts'
      - '**/*.fr-CA.md'
      - 'console/src/messages/glossary.ts'
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review (a maintainer runs this for fork pull requests)
        required: true
        type: string

permissions:
  contents: read

# A maintainer's dispatch and the pull request run never cancel each other; a
# newer push cancels only the older pull request run.
concurrency:
  group: i18n-review-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Explain how a fork pull request is reviewed
        run: |
          echo "::notice::Fork pull requests get no secrets. A maintainer runs the i18n-review workflow (workflow_dispatch) with this pull request number."

  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
    steps:
      - name: Resolve the pull request
        id: pr
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "pull request number must be numeric" >&2; exit 1;; esac
          gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid \
            --jq '"base_sha=\(.baseRefOid)\nhead_sha=\(.headRefOid)"' >> "$GITHUB_OUTPUT"
      - name: Trusted scripts from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: base
          persist-credentials: false
      - name: The pull request head, read as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request ref also serves fork heads. The token is not kept in
          # the checkout: the review step reads this tree with the provider key
          # in its environment.
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: head
          persist-credentials: false
      - name: Check that the review can run
        id: gate
        env:
          I18N_REVIEW_PROVIDER: ${{ vars.I18N_REVIEW_PROVIDER }}
        run: |
          if [ ! -f base/scripts/i18n-review.mjs ]; then
            echo "::notice::The base revision has no scripts/i18n-review.mjs yet (the pull request that adds it); nothing to run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$I18N_REVIEW_PROVIDER" ]; then
            echo "::warning::No fr-CA review ran: set the repository variable I18N_REVIEW_PROVIDER (anthropic, mistral or cohere) and its API key secret. make i18n-release-check still blocks a release while any key is unreviewed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse symbolic links in the files the review reads
        if: steps.gate.outputs.run == 'true'
        run: |
          links=$(find head -type l \( -path 'head/console/src/messages/*' -o -name '*.fr-CA.md' \) -not -path 'head/console/node_modules/*' -print)
          if [ -n "$links" ]; then
            echo "::error::Symbolic links are not allowed in the fr-CA review inputs: $links"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: base/.nvmrc
      - name: List the changed fr-CA documents
        id: docs
        if: steps.gate.outputs.run == 'true'
        run: |
          # A deleted or renamed-away document no longer exists in the head tree.
          gh pr diff "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --name-only | grep -E '\.fr-CA\.md$' | while IFS= read -r file; do [ -f "head/$file" ] && echo "$file"; done > docs.txt || true
          echo "count=$(wc -l < docs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Review the changed fr-CA strings and documents
        id: review
        if: steps.gate.outputs.run == 'true'
        # bash -e -o pipefail: tee must not hide the script's exit status.
        shell: bash
        env:
          I18N_REVIEW_PROVIDER: ${{ vars.I18N_REVIEW_PROVIDER }}
          I18N_REVIEW_MODEL: ${{ vars.I18N_REVIEW_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          docs=()
          while IFS= read -r file; do [ -n "$file" ] && docs+=(--doc "$file"); done < docs.txt
          node base/scripts/i18n-review.mjs --root head --base-root base --write-sidecar --report report.json "${docs[@]}" | tee review.log
      - name: Post the findings on the pull request
        if: always() && steps.gate.outputs.run == 'true' && hashFiles('report.json') != ''
        run: |
          {
            echo "### fr-CA review ($(jq -r .provider report.json))"
            echo
            echo "$(jq '.reviewed | length' report.json) keys passed and are recorded as reviewed; $(jq '.findings | length' report.json) findings; $(jq '.criticalFailures | length' report.json) critical keys failing (these fail the check)."
            echo
            jq -r '.findings[:50][] | "- `\(.id)` (\(.kind)): \(.message)"' report.json
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file comment.md
      - name: Keep the updated sidecar as a workflow artifact
        # Nothing is pushed to the pull request branch: a push made with
        # GITHUB_TOKEN starts no workflows, which left the new head without CI
        # (`ci-ok` missing). The passing keys are kept here and recorded in the
        # committed sidecar at release time (docs/ci.md, "fr-CA review and the
        # sidecar").
        if: always() && steps.review.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fr-CA-review-sidecar
          path: head/console/src/messages/.review/fr-CA.json
      - name: Report the result as a commit status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context=i18n-review \
            -f description="fr-CA review: $OUTCOME" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
