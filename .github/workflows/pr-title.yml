name: pr-title

# The squash-merge commit subject is the pull request title (ADR 0024), so the
# title is what the commit policy checks. Unlike CI this runs when the title is
# edited, without re-running the whole pipeline.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the pull request title against .github/commit-policy.json
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: node scripts/commit-policy-check.mjs
