name: Release archives

# Reusable four-runner archive matrix (ADR 0016). Every archive is built natively
# on its own runner: nothing is cross-compiled. Callers: ci.yml (mainline-assets,
# Linux only) and the ADR 0024 release pipeline (all four runners).
#
# Interface other slices build on (ADR 0024 slice 4, ADR 0025 slice 2):
#   - per-leg artifacts named <product>-<version>-<goos>-<goarch>, one per
#     archive (notarx, notarxctl); the linux/amd64 leg also uploads the
#     architecture independent Console and OpenAPI archives;
#   - each Linux leg also repacks its own archives into .deb and .rpm packages
#     with nfpm (ADR 0025), verifies them, smoke-tests the install on that
#     architecture and uploads packages-<version>-linux-<goarch>; the amd64 leg
#     builds the architecture independent notarx-console packages once;
#   - one combined artifact (input assets-artifact) holding the union of every
#     archive and package plus the SHA256SUMS that
#     scripts/write-release-checksums.sh writes over that union.
on:
  workflow_call:
    inputs:
      version:
        description: Stamped version (X.Y.Z, X.Y.Z-nightly.N or a mainline pre-release); no v prefix.
        required: true
        type: string
      sha:
        description: Full commit SHA the archives are built from.
        required: true
        type: string
      assets-artifact:
        description: Name of the combined artifact (union of every archive plus SHA256SUMS).
        required: true
        type: string
      darwin:
        description: Also build the native darwin/arm64 and darwin/amd64 archives (ADR 0016 amendment 2026-11-19). The release pipeline requires them; pushes to main leave them to the release.
        default: true
        type: boolean
      retention-days:
        default: 30
        type: number

permissions:
  contents: read

jobs:
  # The leg list lives here once; the expected archive count is derived from it.
  # The package count is fixed: only the two Linux legs build packages.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      archives: ${{ steps.plan.outputs.archives }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - id: plan
        env:
          DARWIN: ${{ inputs.darwin }}
        run: |
          # The last x86_64 hosted macOS image is macos-15-intel; scripts/native-build-check.sh
          # fails from 2027-09-01 while this label remains (ADR 0016).
          linux='{"goos":"linux","goarch":"amd64","runner":"ubuntu-24.04","console":true},{"goos":"linux","goarch":"arm64","runner":"ubuntu-24.04-arm","console":false}'
          darwin='{"goos":"darwin","goarch":"arm64","runner":"macos-15","console":false},{"goos":"darwin","goarch":"amd64","runner":"macos-15-intel","console":false}'
          if [ "$DARWIN" = true ]; then legs="$linux,$darwin"; else legs="$linux"; fi
          matrix="{\"include\":[$legs]}"
          runners=$(jq '.include | length' <<<"$matrix")
          {
            echo "matrix=$matrix"
            # Runners x two archives, plus the Console and OpenAPI archives.
            echo "archives=$((runners * 2 + 2))"
            # Two Linux legs x (notarx, notarxctl) x (deb, rpm), plus the Console deb and rpm.
            echo "packages=10"
          } >> "$GITHUB_OUTPUT"

  archives:
    name: archives (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.console
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Stamp the version into this workspace (ADR 0024)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm --prefix tools/openapi ci --ignore-scripts --no-audit --no-fund
          ./scripts/stamp-version.sh "$VERSION"
      - name: Build this runner's archives natively
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.sha }}
          BUILD_CONSOLE: ${{ matrix.console }}
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = "${{ matrix.goos }}/${{ matrix.goarch }}"
          # The Console and OpenAPI archives do not depend on the architecture, so
          # only the linux/amd64 leg builds them; the archive contents are unchanged.
          args=()
          if [ "$BUILD_CONSOLE" != true ]; then args+=(--skip-console); fi
          ./scripts/build-release-artifacts.sh \
            --version "$VERSION" \
            --revision "$REVISION" \
            --output dist \
            "${args[@]}"
      - name: Smoke-run this runner's own binaries
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.sha }}
        run: |
          suffix="${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p smoke/server smoke/cli
          tar -xzf "dist/notarx_${VERSION}_$suffix.tar.gz" -C smoke/server
          tar -xzf "dist/notarxctl_${VERSION}_$suffix.tar.gz" -C smoke/cli
          smoke/cli/notarxctl version | grep -F "notarxctl $VERSION (revision $REVISION,"
          smoke/server/notarx version | grep -F "notarx $VERSION"
      # Linux legs repack the archives they just built, so the packaged binary is
      # byte-identical to the archived one (package-check compares the hashes).
      - name: Cache the pinned nfpm
        if: matrix.goos == 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/notarx/nfpm
          key: nfpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/nfpm.version', 'scripts/install-nfpm.sh') }}
      - name: Build, verify and smoke-test the native packages (ADR 0025)
        if: matrix.goos == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD_CONSOLE: ${{ matrix.console }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm cpio
          args=()
          if [ "$BUILD_CONSOLE" = true ]; then args+=(--console); fi
          ./scripts/build-packages.sh --version "$VERSION" --assets dist --output packages "${args[@]}"
          ./scripts/package-check.sh --verify --packages packages --assets dist --version "$VERSION" "${args[@]}"
          ./scripts/package-install-test.sh --packages packages
      - name: Run the CLI unit tests (no Docker on hosted macOS)
        if: matrix.goos == 'darwin'
        run: make cli-test
      - name: Upload the notarx archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarx-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/notarx_${{ inputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: Upload the notarxctl archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarxctl-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/notarxctl_${{ inputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: Upload the native packages
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            packages/*.deb
            packages/*.rpm
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: Upload the architecture independent archives
        if: matrix.console
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-openapi-${{ inputs.version }}
          path: |
            dist/notarx-console_${{ inputs.version }}_web.tar.gz
            dist/notarx-openapi_${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  assemble-release:
    needs: [plan, archives]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      # Explicit per-product patterns: a version-wide glob would also sweep in the
      # combined artifact (and any other artifact named after the version) on a re-run.
      - name: Download the notarx archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: notarx-${{ inputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Download the notarxctl archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: notarxctl-${{ inputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Download the Console and OpenAPI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-openapi-${{ inputs.version }}
          path: dist
      - name: Download the native packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-${{ inputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Write one checksum file over the union
        env:
          VERSION: ${{ inputs.version }}
          ARCHIVES: ${{ needs.plan.outputs.archives }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          ls -1 dist
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = "$ARCHIVES"
          test "$(find dist -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) | wc -l | tr -d ' ')" = "$PACKAGES"
          ./scripts/write-release-checksums.sh dist
          test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" = "$((ARCHIVES + PACKAGES))"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload the combined release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.assets-artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
