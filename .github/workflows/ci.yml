name: CI

# Pull requests run the test suite. A push to main runs no tests (ADR 0024, amendment of
# 2026-11-19): it only publishes the main archives and images. The release pipeline
# (release.yml) tests the commit it releases with the same suite.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Fall through to the origin on any proxy failure (a "|" separator, unlike
  # ",", also covers stream errors, not only 404/410).
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the change (docs/ci.md). Heavy jobs run only when their class
  # changed; an unresolvable range runs everything. It also enforces the owner rule
  # that no Chinese content may be added anywhere (zh-CN deletions are allowed), on
  # every pull request, not only when docs changed; it used to be a job of its own.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.classify.outputs.go }}
      console: ${{ steps.classify.outputs.console }}
      docs: ${{ steps.classify.outputs.docs }}
      ci: ${{ steps.classify.outputs.ci }}
      images: ${{ steps.classify.outputs.images }}
      arm64: ${{ steps.classify.outputs.arm64 }}
      e2e_specs: ${{ steps.select.outputs.specs }}
      no_chinese: ${{ steps.no-chinese.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The policy check must not hold back the classification every other job needs:
      # a violation is recorded here, the suite still runs, and ci-ok fails.
      - name: Reject added Chinese content
        id: no-chinese
        run: |
          if python3 scripts/check-no-chinese.py; then
            echo result=success >> "$GITHUB_OUTPUT"
          else
            echo "::error::the change adds Chinese content; ci-ok fails on it"
            echo result=failure >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the classifier fixtures
        run: |
          bash scripts/ci-changes-test.sh
          bash scripts/ci-e2e-select-test.sh
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Select the Console E2E specs the change affects
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci-e2e-select.sh "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  # The OCI Always Free reference deployment (ADR 0017, deploy/oci-free-tier):
  # rendered Compose model and limits, arm64 manifests of every third-party
  # image, and a smoke run on a native arm64 runner (the A1 VM is arm64) that
  # pushes and pulls an OCI image and a Raw file through Caddy.
  oci-free-tier:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install the YAML parser the check fixtures use
        run: sudo apt-get install -y --no-install-recommends python3-yaml
      - name: Check the rendered Compose model, limits and layout
        run: make oci-free-tier-check
      - name: Check that every third-party image publishes linux/arm64
        run: make oci-free-tier-images-check
      - name: Build the images the smoke run executes
        run: |
          docker build --tag notarx:local .
          docker build --file Dockerfile.console --tag notarx-console:local .
      - name: Smoke the stack through Caddy
        env:
          NOTARX_IMAGE: notarx:local
          NOTARX_CONSOLE_IMAGE: notarx-console:local
        run: make oci-free-tier-smoke

  # The optional OpenTofu module of the same deployment (ADR 0017 slice 7).
  oci-free-tier-tofu:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: Format, validate and lint the module
        run: make oci-free-tier-tofu-check

  # The test jobs live in test-suite.yml, shared with the release gates (ADR 0024).
  # Pull requests only: a push to main runs no tests.
  tests:
    needs: changes
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test-suite.yml
    with:
      scope: pull-request
      go: ${{ needs.changes.outputs.go == 'true' }}
      console: ${{ needs.changes.outputs.console == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}
      images: ${{ needs.changes.outputs.images == 'true' }}
      arm64: ${{ needs.changes.outputs.arm64 == 'true' }}
      e2e_specs: ${{ needs.changes.outputs.e2e_specs }}

  # The one stable required check: passes when every job succeeded or was
  # skipped by change detection, fails on any failure or cancellation. On a push to
  # main every job here is skipped, so it passes without running any test.
  ci-ok:
    if: always()
    needs: [changes, tests, oci-free-tier, oci-free-tier-tofu]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          IMAGES: ${{ needs.changes.outputs.images }}
          NO_CHINESE: ${{ needs.changes.outputs.no_chinese }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [[ "$EVENT" == pull_request && "$NO_CHINESE" != success ]]; then
            echo "::error::the change adds Chinese content (see the changes job), or the check did not run: $NO_CHINESE"
            exit 1
          fi
          echo "$NEEDS" | jq -e '[.[] | select(.result != "success" and .result != "skipped")] | length == 0' >/dev/null
          # A skip is legitimate only when change detection turned the job off (the
          # test suite checks its own classes) or the event runs no tests at all;
          # a job skipped because something upstream failed must not pass.
          status=0
          required=()
          if [[ "$EVENT" == pull_request ]]; then required+=(changes tests); fi
          if [[ "$IMAGES" == true ]]; then required+=(oci-free-tier oci-free-tier-tofu); fi
          for job in "${required[@]}"; do
            result=$(echo "$NEEDS" | jq -r --arg job "$job" '.[$job].result')
            if [[ "$result" != success ]]; then
              echo "::error::$job is required here but its result is $result"
              status=1
            fi
          done
          exit $status

  # Mainline publication (ADR 0016): the only jobs a push to main runs. No test runs here:
  # the nightly release gates test the commit they release (ADR 0024). Both jobs call the reusable workflows that the
  # ADR 0024 release pipeline also calls. Archives build natively on four runners;
  # each image builds natively per architecture and is merged afterwards.
  mainline-plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          # The single list of published images (ADR 0016) is scripts/release-images.json.
          {
            echo "images=$(jq -c . scripts/release-images.json)"
            echo "version=$(tr -d '[:space:]' < VERSION)-main.${GITHUB_SHA::12}"
            echo 'tags<<EOF'
            echo main
            echo "main-sha-${GITHUB_SHA::12}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  mainline-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mainline-plan
    uses: ./.github/workflows/release-archives.yml
    with:
      version: ${{ needs.mainline-plan.outputs.version }}
      sha: ${{ github.sha }}
      assets-artifact: notarx-${{ needs.mainline-plan.outputs.version }}
      # Hosted macOS capacity outages must not turn main red (ADR 0016 amendment 2026-11-19):
      # nothing on main consumes darwin archives; the release builds and requires them.
      darwin: false

  mainline-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mainline-plan
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      version: ${{ needs.mainline-plan.outputs.version }}
      sha: ${{ github.sha }}
      tags: ${{ needs.mainline-plan.outputs.tags }}
      require-main-tip: true
      # The single list of published images (ADR 0016) is scripts/release-images.json:
      # adding one is one entry there (and its release-gate check).
      images: ${{ needs.mainline-plan.outputs.images }}
