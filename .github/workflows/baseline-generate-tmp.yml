name: Baseline generate (temporary)

# Temporary: generates the re-squashed baseline with scripts/baseline-generate.sh
# on a runner that has docker (ADR 0015 slice 7). Removed before merge.
# Regenerated after the migrations 000022 and 000023 landed on main.
on:
  pull_request:
    paths:
      - .github/workflows/baseline-generate-tmp.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Generate the baseline from the chain at the base commit
        run: scripts/baseline-generate.sh --source-ref "${{ github.event.pull_request.base.sha }}" --source-dir migrations --output "$RUNNER_TEMP/000001_baseline.sql"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline
          path: ${{ runner.temp }}/000001_baseline.sql
