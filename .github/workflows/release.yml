name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify tag, version, main tip, and CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The committed tree is at 0.0.0-dev; the release version comes from the
          # tag and is stamped into the build (ADR 0024).
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          # The required checks are listed in scripts/release-required-checks.txt.
          ./scripts/release-plan.sh green "$GITHUB_SHA"
      - name: Verify release version stamping
        run: |
          npm --prefix tools/openapi ci --ignore-scripts --no-audit --no-fund
          version="${GITHUB_REF_NAME#v}"
          ./scripts/stamp-version.sh "$version"
          make release-version-check EXPECT_VERSION="$version"

  build-assets:
    needs: verify-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Stamp the release version
        run: |
          npm --prefix tools/openapi ci --ignore-scripts --no-audit --no-fund
          ./scripts/stamp-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build release assets
        run: |
          ./scripts/build-release-artifacts.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --revision "$GITHUB_SHA" \
            --output dist
      - name: Upload release candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-gateway-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-images:
    needs: verify-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: artifact-gateway
            file: Dockerfile
          - image: artifact-gateway-console
            file: Dockerfile.console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stamp the release version
        run: |
          npm --prefix tools/openapi ci --ignore-scripts --no-audit --no-fund
          ./scripts/stamp-version.sh "${GITHUB_REF_NAME#v}"
      - name: Resolve release version
        id: version
        run: |
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Generate release image metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=release-candidate-${{ steps.version.outputs.short_sha }}
      - name: Build and publish release image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
      - name: Verify and promote the immutable release image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          if [ "${{ matrix.image }}" = artifact-gateway ]; then
            docker run --rm "$IMAGE@$DIGEST" version | grep -F "notarx $VERSION (revision $GITHUB_SHA,"
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:${VERSION%.*}" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"

  publish-release:
    needs: [build-assets, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: artifact-gateway-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
