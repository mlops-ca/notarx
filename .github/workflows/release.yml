name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify tag, version, main tip, and CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The committed tree is at 0.0.0-dev; the release version comes from the
          # tag and is stamped into the build (ADR 0024).
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          # The required checks are listed in scripts/release-required-checks.txt.
          ./scripts/release-plan.sh green "$GITHUB_SHA"
      - name: Verify release version stamping
        run: |
          npm --prefix tools/openapi ci --ignore-scripts --no-audit --no-fund
          version="${GITHUB_REF_NAME#v}"
          ./scripts/stamp-version.sh "$version"
          make release-version-check EXPECT_VERSION="$version"
      - name: Resolve the release version and image tags
        id: plan
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$version"
            echo "${version%.*}"
            echo latest
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build-assets:
    needs: verify-candidate
    uses: ./.github/workflows/release-archives.yml
    with:
      version: ${{ needs.verify-candidate.outputs.version }}
      sha: ${{ github.sha }}
      assets-artifact: artifact-gateway-${{ github.ref_name }}
      retention-days: 90

  # Image tags are public and immutable, so they are created only after the
  # archives of every runner built and checksummed.
  publish-images:
    needs: [verify-candidate, build-assets]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      version: ${{ needs.verify-candidate.outputs.version }}
      sha: ${{ github.sha }}
      tags: ${{ needs.verify-candidate.outputs.tags }}
      images: >-
        [{"image": "notarx", "file": "Dockerfile", "version-command": true},
        {"image": "notarx-console", "file": "Dockerfile.console", "version-command": false}]

  publish-release:
    needs: [build-assets, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: artifact-gateway-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
