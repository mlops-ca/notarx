name: Release

# Nightly release pipeline (ADR 0024). One workflow, two triggers: schedule (a
# nightly pre-release of the newest commit of main) and workflow_dispatch
# (a manual run; dry_run defaults to true: it plans, runs the gates and builds the
# archives and images without pushing anything, and publishes nothing).
# The stable channel is added to this job graph by ADR 0024 slice 5. There is no tag
# trigger: the workflow creates the tag itself as its last step, so a failed run
# leaves only untagged digests and the next night retries.
#
#   plan      read-only; the only place the version is computed (release-plan.sh)
#   gates     the complete test suite (test-suite.yml) on the planned commit, on both
#             architectures; pushes to main run no tests, so this is the only place a
#             released commit is tested
#   build     ADR 0016 reusable workflows: images (per architecture, merged,
#             attested) and the four-runner archive matrix
#   publish   SHA256SUMS, release-manifest.json, archive attestations, verification
#             of every attestation, then one "gh release create" that makes tag and
#             pre-release together
#   prune     retention of releases, tags and GHCR versions (dry run unless a real run)
#
# Extension point: later ADR jobs (ADR 0025 channels, ADR 0026 publish-feeds and
# verify-feeds) declare needs: publish and read the plan outputs; they never change plan.
on:
  schedule:
    # 03:17 UTC, off the hour to avoid the scheduled-workflow load peak.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan, run the gates and build the archives and images (nothing is pushed); never publish, tag or attest.
        type: boolean
        default: true

permissions:
  contents: read

# Releases are serialised and a running release is never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Best effort only: GitHub documents repository activity as the only thing that resets
  # the 60-day inactivity timer, so nothing relies on this call. The monthly alert in
  # release-liveness.yml is the guarantee (docs/releasing.md).
  liveness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Ask GitHub to keep this scheduled workflow enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/enable" || echo "::warning::the workflow-enable call failed; the liveness alert still covers a disabled schedule"

  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      core: ${{ steps.plan.outputs.core }}
      sha: ${{ steps.plan.outputs.sha }}
      previous: ${{ steps.plan.outputs.previous }}
      # Where commit ranges start: the previous release, or the fork commit before the first one.
      base: ${{ steps.plan.outputs.base }}
      tags: ${{ steps.tags.outputs.tags }}
      images: ${{ steps.tags.outputs.images }}
      # true when the run also publishes; false for a skip and for a dry run.
      publish: ${{ steps.tags.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute the nightly plan
        id: plan
        # bash adds pipefail: a failing plan must fail the step, not publish an empty plan.
        shell: bash
        run: ./scripts/release-plan.sh nightly | tee -a "$GITHUB_OUTPUT"
      - name: Resolve the image tags and whether this run publishes
        id: tags
        env:
          SKIP: ${{ steps.plan.outputs.skip }}
          VERSION: ${{ steps.plan.outputs.version }}
          PLAN_SHA: ${{ steps.plan.outputs.sha }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "images=$(jq -c . scripts/release-images.json)" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$SKIP" != true ] && { [ "$EVENT" = schedule ] || [ "$DRY_RUN" != true ]; }; then
            publish=true
          fi
          # Only main is released; a dry run may plan from any branch.
          if [ "$publish" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release runs only from main, not from $GITHUB_REF"
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = true ]; then
            echo "::notice::release skipped: no new releasing commit on main"
            echo "No nightly this run: nothing new to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo 'tags<<EOF'
            echo nightly
            echo "$VERSION"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo
            echo "- version: $VERSION (tag v$VERSION, pre-release)"
            echo "- commit: $PLAN_SHA"
            echo "- previous release: $PREVIOUS"
            echo "- image tags: nightly, $VERSION"
            echo "- publishes: $publish (dry run: $DRY_RUN)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Warn about commit subjects that break the commit policy
        if: steps.plan.outputs.skip != 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          BASE: ${{ steps.plan.outputs.base }}
        run: node scripts/commit-policy-check.mjs --warn-range "${BASE:+$BASE..}$SHA"

  # --- gates: the complete test suite on the planned commit -----------------------
  # Pushes to main run no tests (ADR 0024, amendment of 2026-11-19), so this is where a
  # commit is tested before anything is built or published. It is the same suite pull
  # request CI runs (test-suite.yml), with every class on and the mainline contract
  # scope: both architectures, every lane.
  gates-suite:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    uses: ./.github/workflows/test-suite.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      scope: mainline
      go: true
      console: true
      docs: true
      images: true

  gates:
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    needs: [plan, gates-suite]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete suite to succeed on the planned commit
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '[.[] | select(.result != "success")] | length == 0' >/dev/null

  # --- build: ADR 0016 reusable workflows ------------------------------------------
  build-archives:
    needs: [plan, gates]
    uses: ./.github/workflows/release-archives.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ needs.plan.outputs.sha }}
      assets-artifact: notarx-v${{ needs.plan.outputs.version }}
      # A dry run keeps its archives for a day only.
      retention-days: ${{ needs.plan.outputs.publish == 'true' && 90 || 1 }}

  # Image tags are public, so the tag merge runs only after the gate passed. Archives and
  # images build side by side; publish needs both.
  build-images:
    needs: [plan, gates]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ needs.plan.outputs.sha }}
      tags: ${{ needs.plan.outputs.tags }}
      images: ${{ needs.plan.outputs.images }}
      # A dry run builds and checks the images natively but pushes, tags and attests nothing.
      dry-run: ${{ needs.plan.outputs.publish != 'true' }}

  build:
    needs: [plan, build-archives, build-images]
    # Skipped (not failed) when the gates failed, as before; only a started build is reported.
    if: ${{ !cancelled() && needs.build-archives.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every archive and image, with a rerun hint
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[] | select(.result != "success")] | length == 0' >/dev/null; then
            echo "archives and images built (attested only when the run publishes)"
            exit 0
          fi
          # A hosted runner that is never acquired (for example a macOS capacity outage) ends
          # its job with the annotation "not acquired by Runner". Other legs can also show as
          # cancelled because the matrix is fail-fast, so the legs themselves must be inspected.
          echo "::error::Archives or images did not all build. Native darwin/arm64 and darwin/amd64 archives are required. Open the failing legs of this run: if the only failure is 'The job was not acquired by Runner' (no log), no runner was assigned and re-running the failed jobs is the action. Any leg with a log and a failed step is a real build failure to fix first; legs cancelled after it are collateral."
          exit 1

  # --- publish: tag and pre-release in one call, as the last step ---------------------
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CORE: ${{ needs.plan.outputs.core }}
      SHA: ${{ needs.plan.outputs.sha }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      BASE: ${{ needs.plan.outputs.base }}
      IMAGES: ${{ needs.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarx-v${{ needs.plan.outputs.version }}
          path: dist
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write SHA256SUMS and release-manifest.json
        run: |
          args=()
          for image in $(jq -r '.[].image' <<<"$IMAGES"); do
            digest=$(docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY_OWNER/$image:$VERSION" --format '{{ json .Manifest }}' | jq -r .digest)
            args+=(--image "$image=$digest")
          done
          ./scripts/release-manifest.sh --version "$VERSION" --core "$CORE" --sha "$SHA" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --assets dist --images-json "$IMAGES" "${args[@]}"
          cat dist/release-manifest.json
      # Native packages are unsigned (ADR 0025 amendment); their integrity is SHA256SUMS plus
      # these keyless attestations, one per file.
      - name: Attest the archives and the native packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      - name: Verify every attestation against this repository's workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/verify-release-attestations.sh --repo "$GITHUB_REPOSITORY" \
            --manifest dist/release-manifest.json --assets dist --registry "ghcr.io/$GITHUB_REPOSITORY_OWNER"
      - name: Cache the pinned git-cliff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/notarx/git-cliff
          key: git-cliff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/git-cliff.version', 'scripts/install-git-cliff.sh') }}
      - name: Generate the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cliff=$(./scripts/install-git-cliff.sh)
          "$cliff" --config cliff.toml "${BASE:+$BASE..}$SHA" --tag "v$VERSION" --strip all > notes.md
          [ -s notes.md ] || echo "No user-facing changes." > notes.md
          {
            echo
            echo "Commit: $SHA. Images: $(jq -r '.images | keys | join(", ")' dist/release-manifest.json), tags nightly and $VERSION."
          } >> notes.md
      # The release App owns tag creation (ruleset tag-creation, docs/releasing.md). Until it is
      # registered the workflow token creates the tag.
      - name: Mint the release App token
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Create the tag and the pre-release in one call
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" --prerelease --target "$SHA" --title "v$VERSION" \
            --notes-file notes.md dist/*.tar.gz dist/*.deb dist/*.rpm dist/SHA256SUMS dist/release-manifest.json

  # --- prune: retention after a successful nightly, or a dry run on demand -------------
  prune:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      # A real run only after this run's own nightly was published; everything else is a dry run.
      APPLY: ${{ needs.publish.result == 'success' }}
      IMAGES: ${{ needs.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mint the release App token
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # Only the release App may delete nightly tags once the rulesets are applied.
      - name: Prune nightly releases and tags
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          flag=
          if [ "$APPLY" = true ]; then flag=--apply; fi
          ./scripts/prune-releases.sh --retained-out "$RUNNER_TEMP/retained.txt" $flag
      - name: Prune GHCR versions (mark and sweep)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flag=
          if [ "$APPLY" = true ]; then flag=--apply; fi
          packages=$(jq -r '[.[].image] | join(",")' <<<"$IMAGES")
          node scripts/prune-ghcr.mjs --owner "$GITHUB_REPOSITORY_OWNER" --packages "$packages" \
            --retained-nightlies "$RUNNER_TEMP/retained.txt" $flag
