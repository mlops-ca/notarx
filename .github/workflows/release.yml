name: Release

# Release pipeline (ADR 0024). One workflow, two triggers: schedule (a nightly
# pre-release of the newest commit of main) and workflow_dispatch (a manual run of either
# channel; dry_run defaults to true: it plans, runs the gates and builds the archives and
# images without pushing anything, and publishes nothing). channel=stable promotes the
# commit of a verified nightly: the same job graph runs at that commit with the clean
# X.Y.Z stamped, so no stable artifact reports a nightly. There is no tag trigger: the
# workflow creates the tag itself as its last step, so a failed run leaves only untagged
# digests and the next night retries.
#
#   plan      read-only; the only place the version is computed (release-plan.sh); for a
#             stable run also the first-release gate (baseline-gate.sh)
#   verify-nightly  stable only: the nightly's manifest, commit and attestations verify
#                   (promote-release.sh verify)
#   gates     the complete test suite (test-suite.yml) on the planned commit, on both
#             architectures; pushes to main run no tests, so this is the only place a
#             released commit is tested
#   build     ADR 0016 reusable workflows: images (per architecture, merged,
#             attested) and the four-runner archive matrix
#   publish   SHA256SUMS, release-manifest.json, archive attestations, verification
#             of every attestation, then one call that makes tag and release together
#             (nightly: "gh release create --prerelease"; stable: promote-release.sh create)
#   promote   stable only, after the tag: notes of the nightly, then :latest
#   homebrew  stable only: renders Formula/notarxctl.rb from the release's SHA256SUMS and pushes it
#             to mlops-ca/homebrew-tap with a token of the tap App (that repository only)
#   changelog stable only: opens the docs(changelog) pull request with the App token
#   prune     retention of releases, tags and GHCR versions (dry run unless a real run)
#
# Extension point: later ADR jobs (ADR 0025 channels, ADR 0026 publish-feeds and
# verify-feeds) declare needs: publish and read the plan outputs; they never change plan.
on:
  schedule:
    # 03:17 UTC, off the hour to avoid the scheduled-workflow load peak.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: nightly (a manual run of the nightly pipeline) or stable (rebuild the commit of a verified nightly).
        type: choice
        options:
          - nightly
          - stable
        default: nightly
      nightly_tag:
        description: Stable only. The nightly tag whose commit is rebuilt; empty means the latest nightly.
        type: string
        default: ""
      version_override:
        description: Stable only. Release this X.Y.Z instead of the nightly's core (0.1.0 is the only value before the first stable release).
        type: string
        default: ""
      dry_run:
        description: Plan, verify, run the gates and build the archives and images (nothing is pushed); never publish, tag or attest.
        type: boolean
        default: true

permissions:
  contents: read

# Releases are serialised and a running release is never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Best effort only: GitHub documents repository activity as the only thing that resets
  # the 60-day inactivity timer, so nothing relies on this call. The monthly alert in
  # release-liveness.yml is the guarantee (docs/releasing.md).
  liveness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Ask GitHub to keep this scheduled workflow enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/enable" || echo "::warning::the workflow-enable call failed; the liveness alert still covers a disabled schedule"

  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      core: ${{ steps.plan.outputs.core }}
      channel: ${{ steps.plan.outputs.channel }}
      nightly_tag: ${{ steps.plan.outputs.nightly_tag }}
      sha: ${{ steps.plan.outputs.sha }}
      previous: ${{ steps.plan.outputs.previous }}
      # Where commit ranges start: the previous release, or the fork commit before the first one.
      base: ${{ steps.plan.outputs.base }}
      tags: ${{ steps.tags.outputs.tags }}
      annotations: ${{ steps.tags.outputs.annotations }}
      images: ${{ steps.tags.outputs.images }}
      # true when the run also publishes; false for a skip and for a dry run.
      publish: ${{ steps.tags.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute the plan
        id: plan
        # bash adds pipefail: a failing plan must fail the step, not publish an empty plan.
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          args=("$CHANNEL")
          if [ "$CHANNEL" = stable ]; then
            if [ -n "$NIGHTLY_TAG" ]; then args+=(--nightly-tag "$NIGHTLY_TAG"); fi
            if [ -n "$VERSION_OVERRIDE" ]; then args+=(--version-override "$VERSION_OVERRIDE"); fi
          elif [ -n "$NIGHTLY_TAG$VERSION_OVERRIDE" ]; then
            echo "::error::nightly_tag and version_override apply to channel=stable only"
            exit 1
          fi
          ./scripts/release-plan.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      # ADR 0015: until the first stable tag exists, only the single re-squashed baseline migration
      # may be released, as 0.1.0. Afterwards scripts/migration-immutability-check.sh governs.
      - name: First-release gate
        if: steps.plan.outputs.channel == 'stable'
        env:
          PLAN_SHA: ${{ steps.plan.outputs.sha }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          args=(--sha "$PLAN_SHA")
          if [ -n "$VERSION_OVERRIDE" ]; then args+=(--version-override "$VERSION_OVERRIDE"); fi
          ./scripts/baseline-gate.sh "${args[@]}"
      - name: Resolve the image tags and whether this run publishes
        id: tags
        env:
          SKIP: ${{ steps.plan.outputs.skip }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          NIGHTLY_TAG: ${{ steps.plan.outputs.nightly_tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PLAN_SHA: ${{ steps.plan.outputs.sha }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "images=$(jq -c . scripts/release-images.json)" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$SKIP" != true ] && { [ "$EVENT" = schedule ] || [ "$DRY_RUN" != true ]; }; then
            publish=true
          fi
          # Only main is released; a dry run may plan from any branch.
          if [ "$publish" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release runs only from main, not from $GITHUB_REF"
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = true ]; then
            echo "::notice::release skipped: no new releasing commit on main"
            echo "No nightly this run: nothing new to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$CHANNEL" = stable ]; then
            # :X.Y.Z and :X.Y only. :0 is never published while the major is 0 and :latest moves
            # last, in the promote job, after the Git tag.
            {
              echo 'tags<<EOF'
              echo "$VERSION"
              echo "${VERSION%.*}"
              echo EOF
            } >> "$GITHUB_OUTPUT"
            echo "annotations=index:io.mlops.notarx.verified-nightly=$NIGHTLY_TAG" >> "$GITHUB_OUTPUT"
            {
              echo "### Release plan (stable)"
              echo
              echo "- version: $VERSION (tag v$VERSION), rebuilt from the verified nightly $NIGHTLY_TAG"
              echo "- commit: $PLAN_SHA"
              echo "- previous stable release: ${PREVIOUS:-none}"
              echo "- image tags: $VERSION, ${VERSION%.*}; :latest moves last"
              echo "- publishes: $publish (dry run: $DRY_RUN)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo 'tags<<EOF'
              echo nightly
              echo "$VERSION"
              echo EOF
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Release plan"
              echo
              echo "- version: $VERSION (tag v$VERSION, pre-release)"
              echo "- commit: $PLAN_SHA"
              echo "- previous release: $PREVIOUS"
              echo "- image tags: nightly, $VERSION"
              echo "- publishes: $publish (dry run: $DRY_RUN)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Warn about commit subjects that break the commit policy
        if: steps.plan.outputs.skip != 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          BASE: ${{ steps.plan.outputs.base }}
        run: node scripts/commit-policy-check.mjs --warn-range "${BASE:+$BASE..}$SHA"

  # --- verify-nightly: a stable run first proves that the nightly it promotes was built and
  # attested by this pipeline (images are read from GHCR, as in publish). ----------------
  verify-nightly:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the nightly record and every attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ needs.plan.outputs.nightly_tag }}
          PLAN_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          ./scripts/promote-release.sh verify --repo "$GITHUB_REPOSITORY" --nightly-tag "$NIGHTLY_TAG" \
            --sha "$PLAN_SHA" --dir "$RUNNER_TEMP/nightly"

  # --- gates: the complete test suite on the planned commit -----------------------
  # Pushes to main run no tests (ADR 0024, amendment of 2026-11-19), so this is where a
  # commit is tested before anything is built or published. It is the same suite pull
  # request CI runs (test-suite.yml), with every class on and the mainline contract
  # scope: both architectures, every lane.
  gates-suite:
    needs: [plan, verify-nightly]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' && (needs.verify-nightly.result == 'success' || needs.verify-nightly.result == 'skipped') }}
    uses: ./.github/workflows/test-suite.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      scope: mainline
      go: true
      console: true
      docs: true
      images: true

  gates:
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' }}
    needs: [plan, verify-nightly, gates-suite]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the verified nightly (stable) and the complete suite to succeed on the planned commit
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.plan.result == "success" and .["gates-suite"].result == "success" and (.["verify-nightly"].result | IN("success", "skipped"))' >/dev/null

  # --- build: ADR 0016 reusable workflows ------------------------------------------
  build-archives:
    needs: [plan, gates]
    uses: ./.github/workflows/release-archives.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ needs.plan.outputs.sha }}
      assets-artifact: notarx-v${{ needs.plan.outputs.version }}
      # A dry run keeps its archives for a day only.
      retention-days: ${{ needs.plan.outputs.publish == 'true' && 90 || 1 }}

  # Image tags are public, so the tag merge runs only after the gate passed. Archives and
  # images build side by side; publish needs both.
  build-images:
    needs: [plan, gates]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ needs.plan.outputs.sha }}
      tags: ${{ needs.plan.outputs.tags }}
      annotations: ${{ needs.plan.outputs.annotations }}
      images: ${{ needs.plan.outputs.images }}
      # A dry run builds and checks the images natively but pushes, tags and attests nothing.
      dry-run: ${{ needs.plan.outputs.publish != 'true' }}

  build:
    needs: [plan, build-archives, build-images]
    # Skipped (not failed) when the gates failed, as before; only a started build is reported.
    if: ${{ !cancelled() && needs.build-archives.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every archive and image, with a rerun hint
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[] | select(.result != "success")] | length == 0' >/dev/null; then
            echo "archives and images built (attested only when the run publishes)"
            exit 0
          fi
          # A hosted runner that is never acquired (for example a macOS capacity outage) ends
          # its job with the annotation "not acquired by Runner". Other legs can also show as
          # cancelled because the matrix is fail-fast, so the legs themselves must be inspected.
          echo "::error::Archives or images did not all build. Native darwin/arm64 and darwin/amd64 archives are required. Open the failing legs of this run: if the only failure is 'The job was not acquired by Runner' (no log), no runner was assigned and re-running the failed jobs is the action. Any leg with a log and a failed step is a real build failure to fix first; legs cancelled after it are collateral."
          exit 1
      # ADR 0024, version identity: no stable archive, package or VERSION.txt reports a nightly.
      # A stable dry run checks its archives and packages here; a publishing run checks every
      # final asset and the image labels once, in publish. The release tooling (scripts/) comes
      # from this workflow's own commit, never from the rebuilt nightly commit, which may predate
      # it; only the reusable builds check out the planned commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.channel == 'stable' && needs.plan.outputs.publish == 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.channel == 'stable' && needs.plan.outputs.publish == 'false'
        with:
          name: notarx-v${{ needs.plan.outputs.version }}
          path: dist
      - name: Install rpm (reads the .rpm headers)
        if: needs.plan.outputs.channel == 'stable' && needs.plan.outputs.publish == 'false'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends rpm
      - name: Assert that no stable archive or package carries a nightly version (dry run)
        if: needs.plan.outputs.channel == 'stable' && needs.plan.outputs.publish == 'false'
        run: ./scripts/check-no-nightly.sh --dir dist

  # --- publish: tag and pre-release in one call, as the last step ---------------------
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
      # The milestones listed in the stable release notes (release-milestones.sh).
      issues: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CORE: ${{ needs.plan.outputs.core }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      NIGHTLY_TAG: ${{ needs.plan.outputs.nightly_tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      BASE: ${{ needs.plan.outputs.base }}
      IMAGES: ${{ needs.plan.outputs.images }}
    steps:
      # The tooling of this workflow's commit; the full history still holds the planned commit,
      # which the notes range and the tag name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarx-v${{ needs.plan.outputs.version }}
          path: dist
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write SHA256SUMS and release-manifest.json
        run: |
          args=()
          for image in $(jq -r '.[].image' <<<"$IMAGES"); do
            digest=$(docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY_OWNER/$image:$VERSION" --format '{{ json .Manifest }}' | jq -r .digest)
            args+=(--image "$image=$digest")
          done
          if [ "$CHANNEL" = stable ]; then
            # The compose bundle (ADR 0025 slice 3) pins the index digests of this very run, so it is
            # rendered before SHA256SUMS: it is checksummed, attested and attached like an archive.
            # Stable only; a nightly publishes no bundle.
            ./scripts/render-compose-bundle.sh --version "$VERSION" --output dist \
              --registry "ghcr.io/$GITHUB_REPOSITORY_OWNER" "${args[@]}"
            # A stable manifest also records the nightly whose commit was rebuilt.
            args+=(--verified-nightly "$NIGHTLY_TAG")
          fi
          ./scripts/release-manifest.sh --version "$VERSION" --core "$CORE" --sha "$SHA" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --assets dist --images-json "$IMAGES" "${args[@]}"
          cat dist/release-manifest.json
      # Every final asset (SHA256SUMS included), the package headers and the pushed image labels.
      - name: Install rpm (reads the .rpm headers)
        if: env.CHANNEL == 'stable'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends rpm
      - name: Assert that no stable archive, package or image reports a nightly
        if: env.CHANNEL == 'stable'
        run: ./scripts/check-no-nightly.sh --dir dist --manifest dist/release-manifest.json --registry "ghcr.io/$GITHUB_REPOSITORY_OWNER"
      # Native packages are unsigned (ADR 0025 amendment); their integrity is SHA256SUMS plus
      # these keyless attestations, one per file.
      - name: Attest the archives and the native packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      - name: Verify every attestation against this repository's workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/verify-release-attestations.sh --repo "$GITHUB_REPOSITORY" \
            --manifest dist/release-manifest.json --assets dist --registry "ghcr.io/$GITHUB_REPOSITORY_OWNER"
      - name: Cache the pinned git-cliff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/notarx/git-cliff
          key: git-cliff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/git-cliff.version', 'scripts/install-git-cliff.sh') }}
      - name: Generate the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cliff=$(./scripts/install-git-cliff.sh)
          "$cliff" --config cliff.toml "${BASE:+$BASE..}$SHA" --tag "v$VERSION" --strip all > notes.md
          [ -s notes.md ] || echo "No user-facing changes." > notes.md
          if [ "$CHANNEL" = stable ]; then
            # The milestones whose last issue closed since the previous stable release.
            since=()
            if [ -n "$PREVIOUS" ]; then
              since=(--since "$(gh release view "$PREVIOUS" --json publishedAt --jq .publishedAt)")
            fi
            milestones=$(./scripts/release-milestones.sh --repo "$GITHUB_REPOSITORY" "${since[@]}")
            if [ -n "$milestones" ]; then
              printf '\n%s\n' "$milestones" >> notes.md
            fi
            {
              echo
              echo "Rebuilt from the commit of the verified nightly $NIGHTLY_TAG, stamped $VERSION. Commit: $SHA. Images: $(jq -r '.images | keys | join(", ")' dist/release-manifest.json), tags $VERSION and ${VERSION%.*}."
            } >> notes.md
          else
            {
              echo
              echo "Commit: $SHA. Images: $(jq -r '.images | keys | join(", ")' dist/release-manifest.json), tags nightly and $VERSION."
            } >> notes.md
          fi
      # The release App owns tag creation (ruleset tag-creation, docs/releasing.md). Until it is
      # registered the workflow token creates the tag.
      - name: Mint the release App token
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Create the tag and the release in one call
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          if [ "$CHANNEL" = stable ]; then
            # A draft with every asset, published last: the tag appears only then, on the verified commit.
            ./scripts/promote-release.sh create --repo "$GITHUB_REPOSITORY" --version "$VERSION" --sha "$SHA" \
              --notes-file notes.md --assets-dir dist
          else
            gh release create "v$VERSION" --prerelease --target "$SHA" --title "v$VERSION" \
              --notes-file notes.md dist/*.tar.gz dist/*.deb dist/*.rpm dist/SHA256SUMS dist/release-manifest.json
          fi

  # --- promote: stable tail, after the Git tag; idempotent, repaired by "Re-run failed jobs" -------
  promote:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.channel == 'stable' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NIGHTLY_TAG: ${{ needs.plan.outputs.nightly_tag }}
      IMAGES: ${{ needs.plan.outputs.images }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The tooling of this workflow's commit, not of the rebuilt nightly commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point the verified nightly at the stable release
        run: ./scripts/promote-release.sh finish --repo "$GITHUB_REPOSITORY" --version "$VERSION" --nightly-tag "$NIGHTLY_TAG"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest last
        run: |
          ./scripts/promote-release.sh latest --repo "$GITHUB_REPOSITORY" --version "$VERSION" \
            --registry "ghcr.io/$GITHUB_REPOSITORY_OWNER" --images-json "$IMAGES"

  # --- homebrew: stable only; the tap formula of notarxctl (ADR 0025 slice 7), rendered from the
  # SHA256SUMS of the release this run published. The tap is another repository, so its token is
  # a separate GitHub App installed on that repository alone and scoped to it here. ---------------
  homebrew:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.channel == 'stable' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Require the tap App
        env:
          APP_ID: ${{ vars.TAP_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::TAP_APP_ID is not set: register the Homebrew tap App (docs/releasing.md); once it is, re-run this job"
            exit 1
          fi
      - name: Mint the tap App token (the tap repository only)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      # The tooling of this workflow's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app.outputs.token }}
          path: tap
      - name: Download the checksums of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
      - name: Render the formula and push it to the tap
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          ./scripts/render-homebrew-formula.sh --version "$VERSION" --sums "$RUNNER_TEMP/release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --output tap/Formula/notarxctl.rb --keep-newer
          cd tap
          git add Formula/notarxctl.rb
          if git diff --cached --quiet; then
            echo "the tap already carries notarxctl $VERSION: nothing to push"
            exit 0
          fi
          git -c "user.name=${APP_SLUG}[bot]" -c "user.email=${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "notarxctl $VERSION"
          # The tap's default branch, as checked out: a re-run of an older release never gets here
          # with a changed file (--keep-newer), so it cannot downgrade the formula.
          git push origin HEAD

  # --- changelog: stable only; the PR needs the App token, because a PR opened with the workflow
  # token starts no CI. The tag stays on the tested commit; the changelog lands afterwards. ---------
  changelog:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.channel == 'stable' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BASE: ${{ needs.plan.outputs.base }}
    steps:
      - name: Require the release App
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::RELEASE_APP_ID is not set: register the release App (docs/releasing.md); once it is, re-run this job"
            exit 1
          fi
      - name: Mint the release App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Cache the pinned git-cliff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/notarx/git-cliff
          key: git-cliff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/git-cliff.version', 'scripts/install-git-cliff.sh') }}
      - name: Open the changelog pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          GIT_CLIFF=$(./scripts/install-git-cliff.sh)
          export GIT_CLIFF
          ./scripts/changelog-section.sh apply --version "$VERSION" --base "$BASE" --file CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already records $VERSION: nothing to open"
            exit 0
          fi
          branch="changelog/v$VERSION"
          git switch -C "$branch"
          git -c "user.name=${APP_SLUG}[bot]" -c "user.email=${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "docs(changelog): v$VERSION" CHANGELOG.md
          # A re-run rebuilds the same commit, so replacing the branch is safe.
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0 ]; then
            gh pr create --base main --head "$branch" --title "docs(changelog): v$VERSION" \
              --body "Records the stable release v$VERSION in CHANGELOG.md. Generated by the release workflow from the pull request titles since the previous stable release."
          fi

  # --- prune: retention after a successful nightly, or a dry run on demand -------------
  prune:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      # A real run only after this run's own nightly was published; everything else is a dry run.
      APPLY: ${{ needs.publish.result == 'success' }}
      IMAGES: ${{ needs.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mint the release App token
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # Only the release App may delete nightly tags once the rulesets are applied.
      - name: Prune nightly releases and tags
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          flag=
          if [ "$APPLY" = true ]; then flag=--apply; fi
          ./scripts/prune-releases.sh --retained-out "$RUNNER_TEMP/retained.txt" $flag
      - name: Prune GHCR versions (mark and sweep)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flag=
          if [ "$APPLY" = true ]; then flag=--apply; fi
          packages=$(jq -r '[.[].image] | join(",")' <<<"$IMAGES")
          node scripts/prune-ghcr.mjs --owner "$GITHUB_REPOSITORY_OWNER" --packages "$packages" \
            --retained-nightlies "$RUNNER_TEMP/retained.txt" $flag
