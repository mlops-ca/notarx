name: Contract lane

# One lane of the plan in scripts/ci-contract-lanes.json. The caller passes the
# matrix entry produced by `scripts/ci-contract.py matrix`; this workflow names
# no lane and installs only the tools the lane declares it needs.
on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
      timeout:
        required: true
        type: number
      rust:
        default: false
        type: boolean
      node:
        default: false
        type: boolean
      npm:
        default: false
        type: boolean
      # Native runner for the leg (ADR 0016): ubuntu-24.04 (amd64) or
      # ubuntu-24.04-arm (arm64). Nothing is emulated or cross-built.
      runner:
        default: ubuntu-24.04
        type: string
      # Commit to test. Empty means the ref of the calling workflow; the release
      # pipeline (ADR 0024) passes the planned commit.
      sha:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  lane:
    name: contract/${{ inputs.lane }} (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    env:
      GOPROXY: https://proxy.golang.org|direct
      # Compose uses the images built once by ci.yml instead of rebuilding them.
      NOTARX_COMPOSE_BUILD_FLAG: --no-build
      # Maven and Gradle clients run through scripts/egress-guard.sh, which rejects
      # public addresses when this is set (docs/ci.md, hermetic Maven lanes).
      NOTARX_EGRESS_GUARD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ runner.arch }}-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load the prebuilt images
        run: for image in "$RUNNER_TEMP"/images/*.tar; do docker load --input "$image"; done
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Warm the Go module cache with retries
        run: |
          for attempt in 1 2 3 4; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt)" >&2
            if [[ $attempt -lt 4 ]]; then sleep $((attempt * 10)); fi
          done
          exit 1
      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        if: inputs.rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.npm && 'npm' || '' }}
          cache-dependency-path: |
            console/package-lock.json
            tools/openapi/package-lock.json
      - name: Verify public npm lockfile sources before install
        if: inputs.npm
        run: node scripts/npm-lockfile-check.mjs
      - name: Install OpenAPI tooling and Console code generation dependencies
        if: inputs.npm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http --prefix tools/openapi
          npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http --prefix console
        timeout-minutes: 10
      - name: Run the lane steps
        run: python3 scripts/ci-contract.py run "${{ inputs.lane }}" --output "$RUNNER_TEMP/lane"
      - name: Preserve lane logs and raw reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The architecture keeps evidence unique when both legs of a lane fail.
          name: contract-${{ inputs.lane }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lane/
          if-no-files-found: ignore
          retention-days: 7
