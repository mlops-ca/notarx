name: Install Playwright browser
description: >-
  Installs the Playwright Chromium browser and its system dependencies in the
  console directory (npm ci must have run). The browser download and the .deb
  packages for the system dependencies are cached by runner image version,
  architecture and @playwright/test version. On a warm cache the packages are
  installed with dpkg and apt is never contacted.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      working-directory: console
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ env.ImageOS }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Download browser
      shell: bash
      working-directory: console
      run: timeout 300 npx playwright install chromium
    # The system dependencies are .deb packages from the runner's Ubuntu mirror,
    # which is sometimes unreachable or slow (observed on PR 405, 412, 419 and
    # 429). The first run for an image, architecture and Playwright version
    # installs them with apt, which keeps every downloaded package in a
    # user-owned directory. That directory is saved to the cache only when the
    # job succeeds. Later runs restore it and install the packages with dpkg, so
    # shard start-up needs no network access to apt. The image version is part of
    # the key so a new runner image, whose installed baseline differs, is a miss.
    - name: Cache apt packages for the browser dependencies
      id: apt-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-deps
        key: playwright-deps-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Install browser system dependencies from the cache
      if: steps.apt-cache.outputs.cache-hit == 'true'
      shell: bash
      run: sudo dpkg --install --skip-same-version "$HOME"/.cache/playwright-deps/*.deb
    - name: Install browser system dependencies with apt
      if: steps.apt-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: console
      run: |
        mkdir -p ~/.cache/playwright-deps/partial
        printf 'Dir::Cache::Archives "%s/.cache/playwright-deps";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
        npx playwright install-deps chromium
        # apt ran as root; hand the packages to the runner user so the cache
        # save can read them, and drop the root-only lock and partial downloads.
        sudo rm -rf ~/.cache/playwright-deps/partial ~/.cache/playwright-deps/lock
        sudo chown -R "$(id -u):$(id -g)" ~/.cache/playwright-deps
