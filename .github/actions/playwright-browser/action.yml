name: Install Playwright browser
description: >-
  Installs the Playwright Chromium browser and its system dependencies in the
  console directory (npm ci must have run). The browser download and the apt
  packages for the dependencies are cached by runner image, architecture and
  @playwright/test version. apt gets short network timeouts and retries. The
  browser download is time-boxed to 5 minutes and the system dependencies to 10
  with timeout(1) (composite steps have no timeout-minutes).

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      working-directory: console
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ env.ImageOS }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Download browser
      shell: bash
      working-directory: console
      run: timeout 300 npx playwright install chromium
    # The system dependencies come from the runner's Ubuntu mirror, which is
    # sometimes slow enough to take longer than any sane step time (observed on
    # PR 405 and 412). apt update still contacts the mirror, but the package
    # downloads, the slow part, come from a user-owned directory that
    # actions/cache restores. The cache is saved only when the whole job
    # succeeds, so a timed-out install never stores a partial package set under
    # the immutable key.
    - name: Cache apt packages for the browser dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-apt
        key: playwright-apt-${{ env.ImageOS }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Configure apt
      shell: bash
      run: |
        mkdir -p ~/.cache/playwright-apt/partial
        printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "5";\nDir::Cache::Archives "%s/.cache/playwright-apt";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
    - name: Install browser system dependencies
      shell: bash
      working-directory: console
      run: timeout 600 npx playwright install-deps chromium
    # apt ran as root; hand the files back so the cache save can read them.
    - name: Hand the apt package cache back to the runner user
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/playwright-apt
