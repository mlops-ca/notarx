name: Install Playwright browser
description: >-
  Installs the Playwright Chromium browser and its system dependencies in the
  console directory (npm ci must have run). The browser download and the .deb
  packages for the system dependencies are cached by runner image version,
  architecture and @playwright/test version. On a warm cache the packages are
  installed with dpkg and apt is never contacted.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      working-directory: console
      run: |
        version="$(node -p "require('@playwright/test/package.json').version")"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # ImageOS and ImageVersion are runner environment variables, not
        # expression contexts, so the cache keys read them from this output.
        echo "image=${ImageOS}-${ImageVersion}-${RUNNER_ARCH}-$version" >> "$GITHUB_OUTPUT"
        # The system dependency packages of every runner image version share a
        # prefix, so a runner image no cache was saved for starts from the packages
        # of another one (docs/ci.md, Playwright browser install).
        echo "deps-prefix=${ImageOS}-${RUNNER_ARCH}-$version" >> "$GITHUB_OUTPUT"
        echo "deps=${ImageOS}-${RUNNER_ARCH}-$version-${ImageVersion}" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.playwright.outputs.image }}
    - name: Download browser
      shell: bash
      working-directory: console
      run: timeout 300 npx playwright install chromium
    # The system dependencies are .deb packages from the runner's Ubuntu mirror,
    # which is sometimes unreachable or slow (observed on PR 405, 412, 419 and
    # 429). The first run for an image, architecture and Playwright version
    # installs them with apt, which keeps every downloaded package in a
    # user-owned directory. That directory is saved to the cache only when the
    # job succeeds. Later runs restore it and install the packages with dpkg, so
    # shard start-up needs no network access to apt. The image version is part of
    # the key so a new runner image, whose installed baseline differs, is a miss.
    - name: Restore apt packages for the browser dependencies
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-deps
        key: playwright-deps-${{ steps.playwright.outputs.deps }}
        # Not a hit, so the apt path below runs: apt reuses every restored package
        # whose version still matches and downloads only the rest. The pull request
        # scope can restore only what main (the nightly release gates) or this pull
        # request saved, and runner image versions change often, so without the
        # second key a pull request usually started from nothing.
        restore-keys: |
          playwright-deps-${{ steps.playwright.outputs.deps }}-partial-
          playwright-deps-${{ steps.playwright.outputs.deps-prefix }}-
    # A warm cache (exact key) installs with dpkg only. If dpkg refuses (the
    # runner drifted from the image the packages came from), apt installs them
    # instead; that path never saves, so a bad set is not written back.
    - name: Install browser system dependencies from the cache
      if: steps.apt-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: console
      run: |
        sudo dpkg --install --skip-same-version --refuse-downgrade "$HOME"/.cache/playwright-deps/*.deb \
          || timeout 600 npx playwright install-deps chromium
    # A cold run installs with apt, which keeps every downloaded package in the
    # user-owned archive directory. When the mirror is too slow for the time box,
    # the whole packages fetched so far are saved under a partial key and the
    # next run resumes from them (a prefix match restores them but is not a hit).
    - name: Install browser system dependencies with apt
      id: apt-install
      if: steps.apt-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: console
      run: |
        mkdir -p ~/.cache/playwright-deps/partial
        printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "5";\nDir::Cache::Archives "%s/.cache/playwright-deps";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/80-playwright-deps >/dev/null
        # The archive directory setting must not outlive this step, and apt ran
        # as root: hand the packages to the runner user so the cache save can
        # read them, and drop the root-only lock and partial downloads.
        # Packages restored from another runner image version that apt did not
        # use are dropped before the save, so the cache holds one version of each
        # package and does not grow with every image: a package installed at
        # another version always goes, and after a successful install so does
        # every package that is not installed. A failed install keeps those for
        # the next run to resume from.
        finish() {
          local status=$? deb name arch version installed
          sudo rm -f /etc/apt/apt.conf.d/80-playwright-deps
          sudo rm -rf ~/.cache/playwright-deps/partial ~/.cache/playwright-deps/lock
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/playwright-deps
          for deb in ~/.cache/playwright-deps/*.deb; do
            [[ -e "$deb" ]] || continue
            read -r name arch version < <(dpkg-deb --show --showformat='${Package} ${Architecture} ${Version}\n' "$deb") || continue
            if [[ "$arch" != all ]]; then name="$name:$arch"; fi
            installed=$(dpkg-query --show --showformat='${Version}' "$name" 2>/dev/null || true)
            if [[ -n "$installed" && "$installed" != "$version" ]] || [[ "$status" == 0 && -z "$installed" ]]; then
              rm -f "$deb"
            fi
          done
          if ls ~/.cache/playwright-deps/*.deb >/dev/null 2>&1; then echo "debs=true" >> "$GITHUB_OUTPUT"; fi
        }
        trap finish EXIT
        timeout 480 npx playwright install-deps chromium
    # Saved as soon as the step ends, not at the end of the job, so a later flaky
    # test cannot keep the cache from being written. Nothing is saved when no
    # .deb was downloaded.
    - name: Save apt packages for the browser dependencies
      if: always() && steps.apt-install.outcome == 'success' && steps.apt-install.outputs.debs == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-deps
        key: playwright-deps-${{ steps.playwright.outputs.deps }}
    - name: Save the partial apt download
      if: always() && steps.apt-install.outcome == 'failure' && steps.apt-install.outputs.debs == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-deps
        key: playwright-deps-${{ steps.playwright.outputs.deps }}-partial-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.name }}
