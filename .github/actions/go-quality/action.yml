name: Go quality checks
description: >-
  Sets up Go (and Node with the Console tools when lint runs) and runs the Go checks
  of test-suite.yml, so their setup has one definition (ADR 0016). Inputs choose the
  checks: quality-arm64 runs vet and race on ubuntu-24.04-arm, and lint too for an
  architecture-sensitive change and in the release gates; on amd64 the lint job runs
  lint-checks and vet, and the quality job runs race-coverage (the unit tests once,
  with the race detector and every coverage floor). The checkout stays in the job.
  The caches are described in docs/ci.md (Go checks).

inputs:
  lint:
    description: Run the lint target (needs the Console tools for the en-CA spell check).
    default: "true"
  lint-target:
    description: >-
      make lint, or make lint-checks, which leaves out the lint tools' own Go tests (the
      amd64 lint job: its quality job runs every package's tests once).
    default: lint
  vet:
    description: Run make vet.
    default: "true"
  race:
    description: Run make race.
    default: "true"
  race-coverage:
    description: >-
      Run make race-coverage (the unit tests once, with the race detector and the
      coverage floors). Like race, it uses a build cache of its own for the
      race-instrumented build.
    default: "false"
  build-only:
    description: >-
      Compile what race or race-coverage would run (make race-build or make
      race-coverage-build) and run no test: the cache warm of pushes to main (ADR 0024).
      On main it saves the race build cache and deletes the race caches it supersedes,
      so the job needs actions: write.
    default: "false"
  openapi-tools:
    description: Also install tools/openapi (no caller needs it now; the release checks install it in their own job).
    default: "false"

runs:
  using: composite
  steps:
    # A race or race-coverage run keeps its own build cache (below): the setup-go cache
    # is the one main's builds save, and a pull request restores it read-only, so it
    # never holds race-instrumented packages.
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        cache: ${{ inputs.race != 'true' && inputs.race-coverage != 'true' }}
    # The lint results and the race build are restored on every run but saved only by
    # runs on main: an exact hit saves nothing, so a fixed key would freeze the cache,
    # and saves from every pull request would crowd the repository's cache quota. The
    # lint cache has a daily key (the release gates save it). The race build cache gets
    # a key per run, saved by the build-only warm of every push to main and by the
    # release gates; the warm deletes the entries it supersedes. Pull requests restore
    # main's newest cache by prefix.
    - if: inputs.lint == 'true' || inputs.race == 'true' || inputs.race-coverage == 'true'
      name: Locate the Go caches
      id: cache-dirs
      shell: bash
      run: |
        {
          echo "day=$(date -u +%Y-%m-%d)"
          echo "lint=$HOME/.cache/notarx/golangci-lint"
          echo "lint-image=$(sed -n 's/^LINT_IMAGE := //p' Makefile)"
          echo "gomodcache=$(go env GOMODCACHE)"
          echo "gocache=$(go env GOCACHE)"
          echo "go=$(go env GOVERSION)"
        } >> "$GITHUB_OUTPUT"
    # The key carries the runner architecture, so quality (amd64) and quality-arm64
    # each restore the cache their own architecture saved.
    - if: inputs.race == 'true' || inputs.race-coverage == 'true'
      name: Restore the race build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.cache-dirs.outputs.gomodcache }}
          ${{ steps.cache-dirs.outputs.gocache }}
        key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.cache-dirs.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-${{ hashFiles('go.sum') }}-
          go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-
    # make lint runs the en-CA spell check, which needs the Console tools.
    - if: inputs.lint == 'true' || inputs.openapi-tools == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          console/package-lock.json
          tools/openapi/package-lock.json
    - if: inputs.lint == 'true'
      run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
      shell: bash
      working-directory: console
    - if: inputs.openapi-tools == 'true'
      run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
      shell: bash
      working-directory: tools/openapi
    # golangci-lint keeps its analysis results in GOLANGCI_LINT_CACHE (Makefile); the
    # entries are content addressed, so restoring an older cache is safe.
    - if: inputs.lint == 'true'
      name: Restore the golangci-lint cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-dirs.outputs.lint }}
        key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.lint-image }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ steps.cache-dirs.outputs.day }}
        restore-keys: |
          golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.lint-image }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
          golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.lint-image }}-
    - if: inputs.lint == 'true'
      name: Run Go lint
      shell: bash
      env:
        GOLANGCI_LINT_CACHE: ${{ steps.cache-dirs.outputs.lint }}
        LINT_TARGET: ${{ inputs.lint-target }}
      run: make "$LINT_TARGET"
    - if: inputs.lint == 'true' && github.ref == 'refs/heads/main'
      name: Save the golangci-lint cache (main only)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-dirs.outputs.lint }}
        key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.lint-image }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ steps.cache-dirs.outputs.day }}
    - if: inputs.vet == 'true'
      name: Run Go vet
      shell: bash
      run: make vet
    - if: inputs.race == 'true' && inputs.build-only != 'true'
      name: Run race detector
      shell: bash
      run: make race
    - if: inputs.race-coverage == 'true' && inputs.build-only != 'true'
      name: Run the unit tests once with the race detector and enforce the coverage floors
      shell: bash
      run: make race-coverage
    - if: inputs.race == 'true' && inputs.build-only == 'true'
      name: Compile the race build (no test runs)
      shell: bash
      run: make race-build
    - if: inputs.race-coverage == 'true' && inputs.build-only == 'true'
      name: Compile the race and coverage build (no test runs)
      shell: bash
      run: make race-coverage-build
    - if: (inputs.race == 'true' || inputs.race-coverage == 'true') && github.ref == 'refs/heads/main'
      name: Save the race build cache (main only)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.cache-dirs.outputs.gomodcache }}
          ${{ steps.cache-dirs.outputs.gocache }}
        key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.cache-dirs.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
    # Only the newest race build cache of an architecture is ever restored (by prefix),
    # so the warm deletes the older ones instead of leaving them to the quota's eviction.
    - if: inputs.build-only == 'true' && github.ref == 'refs/heads/main'
      name: Delete the superseded race build caches (main only)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.cache-dirs.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
        PREFIX: go-race-${{ runner.os }}-${{ runner.arch }}-
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" --limit 100 --json key --jq '.[].key' |
          while read -r key; do
            [[ "$key" == "$KEEP" ]] || gh cache delete --repo "$GITHUB_REPOSITORY" "$key"
          done
