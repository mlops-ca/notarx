name: Go quality checks
description: >-
  Sets up Go (and Node with the Console tools when lint runs) and runs the Go checks
  of test-suite.yml, so their setup has one definition (ADR 0016). Inputs choose the
  checks: quality-arm64 runs lint, vet and race on ubuntu-24.04-arm; on amd64 the
  lint job runs lint-checks and vet, and the quality job runs race-coverage (the unit
  tests once, with the race detector and every coverage floor). The checkout stays in
  the job. The caches are described in docs/ci.md (Go checks).

inputs:
  lint:
    description: Run the lint target (needs the Console tools for the en-CA spell check).
    default: "true"
  lint-target:
    description: >-
      make lint, or make lint-checks, which leaves out the lint tools' own Go tests (the
      amd64 lint job: its quality job runs every package's tests once).
    default: lint
  vet:
    description: Run make vet.
    default: "true"
  race:
    description: Run make race.
    default: "true"
  race-coverage:
    description: >-
      Run make race-coverage (the unit tests once, with the race detector and the
      coverage floors), with a build cache of its own for the race-instrumented build.
    default: "false"
  openapi-tools:
    description: Also install tools/openapi (needed by the amd64 lint job's later steps).
    default: "false"

runs:
  using: composite
  steps:
    # The race-coverage build keeps its own cache (below): the setup-go cache is the
    # one main's builds save, and a pull request restores it read-only, so it never
    # holds race-instrumented packages.
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        cache: ${{ inputs.race-coverage != 'true' }}
    # The lint results and the race build are restored on every run but saved only by
    # runs on main (the nightly release gates), under a daily key: an exact hit saves
    # nothing, so a fixed key would freeze the cache, and saves from every pull request
    # would crowd the repository's cache quota. Pull requests restore main's newest
    # cache by prefix.
    - if: inputs.lint == 'true' || inputs.race-coverage == 'true'
      name: Locate the Go caches
      id: cache-dirs
      shell: bash
      run: |
        {
          echo "day=$(date -u +%Y-%m-%d)"
          echo "lint=$HOME/.cache/notarx/golangci-lint"
          echo "lint-image=$(sed -n 's/^LINT_IMAGE := //p' Makefile)"
          echo "gomodcache=$(go env GOMODCACHE)"
          echo "gocache=$(go env GOCACHE)"
          echo "go=$(go env GOVERSION)"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.race-coverage == 'true'
      name: Restore the race build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.cache-dirs.outputs.gomodcache }}
          ${{ steps.cache-dirs.outputs.gocache }}
        key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.cache-dirs.outputs.day }}
        restore-keys: |
          go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-${{ hashFiles('go.sum') }}-
          go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-
    # make lint runs the en-CA spell check, which needs the Console tools.
    - if: inputs.lint == 'true' || inputs.openapi-tools == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          console/package-lock.json
          tools/openapi/package-lock.json
    - if: inputs.lint == 'true'
      run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
      shell: bash
      working-directory: console
    - if: inputs.openapi-tools == 'true'
      run: npm ci --ignore-scripts --no-audit --no-fund --timing --loglevel=http
      shell: bash
      working-directory: tools/openapi
    # golangci-lint keeps its analysis results in GOLANGCI_LINT_CACHE (Makefile); the
    # entries are content addressed, so restoring an older cache is safe.
    - if: inputs.lint == 'true'
      name: Restore the golangci-lint cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-dirs.outputs.lint }}
        key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.lint-image }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ steps.cache-dirs.outputs.day }}
        restore-keys: |
          golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.lint-image }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
          golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.lint-image }}-
    - if: inputs.lint == 'true'
      name: Run Go lint
      shell: bash
      env:
        GOLANGCI_LINT_CACHE: ${{ steps.cache-dirs.outputs.lint }}
        LINT_TARGET: ${{ inputs.lint-target }}
      run: make "$LINT_TARGET"
    - if: inputs.lint == 'true' && github.ref == 'refs/heads/main'
      name: Save the golangci-lint cache (main only)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-dirs.outputs.lint }}
        key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.lint-image }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ steps.cache-dirs.outputs.day }}
    - if: inputs.vet == 'true'
      name: Run Go vet
      shell: bash
      run: make vet
    - if: inputs.race == 'true'
      name: Run race detector
      shell: bash
      run: make race
    - if: inputs.race-coverage == 'true'
      name: Run the unit tests once with the race detector and enforce the coverage floors
      shell: bash
      run: make race-coverage
    - if: inputs.race-coverage == 'true' && github.ref == 'refs/heads/main'
      name: Save the race build cache (main only)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.cache-dirs.outputs.gomodcache }}
          ${{ steps.cache-dirs.outputs.gocache }}
        key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-dirs.outputs.go }}-${{ hashFiles('go.sum') }}-${{ steps.cache-dirs.outputs.day }}
