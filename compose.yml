name: artifact-gateway

x-local-dev:
  gateway-port: ${NOTARX_HTTP_PORT:-8080}
  console-port: ${NOTARX_CONSOLE_PORT:-4173}

services:
  gateway:
    # CI builds this once and loads it into every lane (docs/ci.md); locally
    # `build` below produces the same tag.
    image: ${NOTARX_IMAGE:-notarx-gateway:local}
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-ready:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      NOTARX_LISTEN_ADDRESS: :8080
      NOTARX_CONSOLE_THEME_DIR: ${NOTARX_CONSOLE_THEME_DIR:-/themes}
      NOTARX_NODE_ROLES: ${NOTARX_NODE_ROLES:-standalone}
      NOTARX_REPOSITORY_PRESETS: ${NOTARX_REPOSITORY_PRESETS:-standard}
      NOTARX_HELM_PREVIEW_ENABLED: ${NOTARX_HELM_PREVIEW_ENABLED:-false}
      NOTARX_NUGET_PREVIEW_ENABLED: ${NOTARX_NUGET_PREVIEW_ENABLED:-false}
      NOTARX_RUBYGEMS_PREVIEW_ENABLED: ${NOTARX_RUBYGEMS_PREVIEW_ENABLED:-false}
      NOTARX_INSTANCE_ID: ${NOTARX_INSTANCE_ID:-gateway-local}
      NOTARX_PUBLIC_URL: ${NOTARX_PUBLIC_URL:-}
      NOTARX_ACCESS_LOG: ${NOTARX_ACCESS_LOG:-limited}
      NOTARX_ACCESS_LOG_SLOW_MS: ${NOTARX_ACCESS_LOG_SLOW_MS:-1000}
      NOTARX_LOG_BUFFER_LINES: ${NOTARX_LOG_BUFFER_LINES:-1000}
      NOTARX_WORKER_FORMATS: ${NOTARX_WORKER_FORMATS:-}
      NOTARX_WORKER_KINDS: ${NOTARX_WORKER_KINDS:-}
      NOTARX_SCANNER_ENDPOINT: ${NOTARX_SCANNER_ENDPOINT:-}
      NOTARX_SCANNER_HEALTH_ENDPOINT: ${NOTARX_SCANNER_HEALTH_ENDPOINT:-}
      NOTARX_SCANNER_NAME: ${NOTARX_SCANNER_NAME:-}
      NOTARX_SCANNER_TOKEN: ${NOTARX_SCANNER_TOKEN:-}
      NOTARX_SCANNER_TIMEOUT: ${NOTARX_SCANNER_TIMEOUT:-}
      NOTARX_SCANNER_HEALTH_TIMEOUT: ${NOTARX_SCANNER_HEALTH_TIMEOUT:-}
      NOTARX_SCANNER_DATABASE_MAX_AGE: ${NOTARX_SCANNER_DATABASE_MAX_AGE:-}
      NOTARX_SCANNER_MAX_RESPONSE_BYTES: ${NOTARX_SCANNER_MAX_RESPONSE_BYTES:-}
      NOTARX_SCANNER_MAX_ARTIFACT_BYTES: ${NOTARX_SCANNER_MAX_ARTIFACT_BYTES:-}
      NOTARX_SCANNER_FORMATS: ${NOTARX_SCANNER_FORMATS:-}
      NOTARX_APT_RESTORE_TRUSTED_FINGERPRINTS: ${NOTARX_APT_RESTORE_TRUSTED_FINGERPRINTS:-}
      NOTARX_APT_RESTORE_TRUSTED_PUBLIC_KEYS_FILE: ${NOTARX_APT_RESTORE_TRUSTED_PUBLIC_KEYS_FILE:-}
      NOTARX_APT_SIGNER_ENDPOINT: ${NOTARX_APT_SIGNER_ENDPOINT:-}
      NOTARX_APT_SIGNER_TOKEN: ${NOTARX_APT_SIGNER_TOKEN:-}
      NOTARX_APT_SIGNER_TIMEOUT: ${NOTARX_APT_SIGNER_TIMEOUT:-}
      NOTARX_APT_SIGNER_TRUSTED_FINGERPRINTS: ${NOTARX_APT_SIGNER_TRUSTED_FINGERPRINTS:-}
      NOTARX_APT_SIGNER_TRUSTED_PUBLIC_KEYS_FILE: ${NOTARX_APT_SIGNER_TRUSTED_PUBLIC_KEYS_FILE:-}
      NOTARX_APT_SIGNER_TLS_CA_FILE: ${NOTARX_APT_SIGNER_TLS_CA_FILE:-}
      NOTARX_DATABASE_URL: postgres://gateway:${NOTARX_POSTGRES_PASSWORD:?set NOTARX_POSTGRES_PASSWORD in .env}@postgres:5432/gateway?sslmode=disable
      NOTARX_DATABASE_MAX_OPEN_CONNS: ${NOTARX_DATABASE_MAX_OPEN_CONNS:-32}
      NOTARX_DATABASE_MAX_IDLE_CONNS: ${NOTARX_DATABASE_MAX_IDLE_CONNS:-8}
      NOTARX_DATABASE_COORDINATOR_MAX_OPEN_CONNS: ${NOTARX_DATABASE_COORDINATOR_MAX_OPEN_CONNS:-8}
      NOTARX_DATABASE_COORDINATOR_MAX_IDLE_CONNS: ${NOTARX_DATABASE_COORDINATOR_MAX_IDLE_CONNS:-2}
      NOTARX_DATABASE_ARTIFACT_LOCK_MAX_OPEN_CONNS: ${NOTARX_DATABASE_ARTIFACT_LOCK_MAX_OPEN_CONNS:-4}
      NOTARX_DATABASE_ARTIFACT_LOCK_MAX_IDLE_CONNS: ${NOTARX_DATABASE_ARTIFACT_LOCK_MAX_IDLE_CONNS:-1}
      NOTARX_DATABASE_CONN_MAX_LIFETIME: ${NOTARX_DATABASE_CONN_MAX_LIFETIME:-30m}
      NOTARX_DATABASE_CONN_MAX_IDLE_TIME: ${NOTARX_DATABASE_CONN_MAX_IDLE_TIME:-5m}
      NOTARX_RUSTFS_ENDPOINT: http://rustfs:9000
      NOTARX_RUSTFS_BUCKET: gateway-cache
      NOTARX_RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      NOTARX_RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      NOTARX_OCI_PROXY_ALLOWED_HOSTS: ${NOTARX_OCI_PROXY_ALLOWED_HOSTS:-}
      NOTARX_MAVEN_PROXY_ALLOWED_HOSTS: ${NOTARX_MAVEN_PROXY_ALLOWED_HOSTS:-}
      NOTARX_RAW_PROXY_ALLOWED_HOSTS: ${NOTARX_RAW_PROXY_ALLOWED_HOSTS:-}
      NOTARX_RAW_CACHE_MAX_OBJECT_BYTES: ${NOTARX_RAW_CACHE_MAX_OBJECT_BYTES:-}
      NOTARX_RAW_CACHE_MAX_CONCURRENT_SPOOLS: ${NOTARX_RAW_CACHE_MAX_CONCURRENT_SPOOLS:-}
      NOTARX_CONAN_CACHE_MAX_OBJECT_BYTES: ${NOTARX_CONAN_CACHE_MAX_OBJECT_BYTES:-}
      NOTARX_OCI_CACHE_TTL: ${NOTARX_OCI_CACHE_TTL:-}
      NOTARX_MAVEN_CACHE_TTL: ${NOTARX_MAVEN_CACHE_TTL:-}
      NOTARX_MAVEN_METADATA_CACHE_TTL: ${NOTARX_MAVEN_METADATA_CACHE_TTL:-}
      NOTARX_MAVEN_NEGATIVE_CACHE_TTL: ${NOTARX_MAVEN_NEGATIVE_CACHE_TTL:-}
      NOTARX_RAW_CACHE_TTL: ${NOTARX_RAW_CACHE_TTL:-}
      NOTARX_CONAN_CACHE_TTL: ${NOTARX_CONAN_CACHE_TTL:-}
      NOTARX_NPM_METADATA_CACHE_TTL: ${NOTARX_NPM_METADATA_CACHE_TTL:-}
      NOTARX_NPM_NEGATIVE_CACHE_TTL: ${NOTARX_NPM_NEGATIVE_CACHE_TTL:-}
      NOTARX_NPM_PROXY_BREAKER_TTL: ${NOTARX_NPM_PROXY_BREAKER_TTL:-}
      NOTARX_ADMIN_TOKEN: ${NOTARX_ADMIN_TOKEN:?set NOTARX_ADMIN_TOKEN in .env}
      NOTARX_RESOLVER_TOKEN: ${NOTARX_RESOLVER_TOKEN:?set NOTARX_RESOLVER_TOKEN in .env}
      NOTARX_CONAN_TOKEN_SECRET: ${NOTARX_CONAN_TOKEN_SECRET:-}
      NOTARX_EGRESS_PROXY_KEY: ${NOTARX_EGRESS_PROXY_KEY:-}
      NOTARX_MIGRATION_STORAGE_POOL_ID: ${NOTARX_MIGRATION_STORAGE_POOL_ID:-}
      NOTARX_SETTINGS_ENCRYPTION_KEY: ${NOTARX_SETTINGS_ENCRYPTION_KEY:-}
      NOTARX_MIGRATION_SOURCE_PRIVATE_ENDPOINTS: ${NOTARX_MIGRATION_SOURCE_PRIVATE_ENDPOINTS:-}
      NOTARX_REPOSITORY_READERS: ${NOTARX_REPOSITORY_READERS:-}
      NOTARX_LEGACY_READ_DEFAULT: ${NOTARX_LEGACY_READ_DEFAULT:-}
      NOTARX_REPOSITORY_CACHE_QUOTAS: ${NOTARX_REPOSITORY_CACHE_QUOTAS:-}
      NOTARX_OIDC_ISSUER: ${NOTARX_OIDC_ISSUER:-}
      NOTARX_OIDC_AUDIENCE: ${NOTARX_OIDC_AUDIENCE:-}
      NOTARX_OIDC_JWKS_URL: ${NOTARX_OIDC_JWKS_URL:-}
      NOTARX_OIDC_CLIENT_ID: ${NOTARX_OIDC_CLIENT_ID:-}
      NOTARX_OIDC_CLIENT_SECRET: ${NOTARX_OIDC_CLIENT_SECRET:-}
      NOTARX_OIDC_REDIRECT_URL: ${NOTARX_OIDC_REDIRECT_URL:-}
      NOTARX_OIDC_SCOPES: ${NOTARX_OIDC_SCOPES:-}
      NOTARX_OIDC_ADMIN_SUBJECTS: ${NOTARX_OIDC_ADMIN_SUBJECTS:-}
      NOTARX_OIDC_MEMBER_ROLES: ${NOTARX_OIDC_MEMBER_ROLES:-}
      NOTARX_OIDC_ADMIN_ROLES: ${NOTARX_OIDC_ADMIN_ROLES:-}
      NOTARX_OTLP_HTTP_ENDPOINT: ${NOTARX_OTLP_HTTP_ENDPOINT:-}
      NOTARX_OTEL_SAMPLING_RATIO: ${NOTARX_OTEL_SAMPLING_RATIO:-1}
      # 出网代理：让 proxy 仓库的上游请求走宿主机代理（容器经 host-gateway 访问）
      HTTP_PROXY: ${NOTARX_EGRESS_PROXY:-}
      HTTPS_PROXY: ${NOTARX_EGRESS_PROXY:-}
      NO_PROXY: postgres,rustfs,host.docker.internal,127.0.0.1,localhost
    ports:
      - "${NOTARX_HTTP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: ${NOTARX_LOG_MAX_SIZE:-10m}
        max-file: ${NOTARX_LOG_MAX_FILES:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./themes:/themes:ro
    healthcheck:
      test: ["CMD", "/gateway-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  reference-scanner:
    profiles: ["scanner"]
    image: ${NOTARX_SCANNER_IMAGE:-notarx-reference-scanner:local}
    build:
      context: .
      dockerfile: Dockerfile.scanner
    depends_on:
      gateway:
        condition: service_healthy
    # The sidecar shares only Gateway's network namespace and binds loopback.
    # Artifact bytes and an optional bearer token never traverse a Docker network.
    network_mode: "service:gateway"
    environment:
      REFERENCE_SCANNER_LISTEN_ADDRESS: 127.0.0.1:18082
      REFERENCE_SCANNER_TOKEN: ${NOTARX_SCANNER_TOKEN:-}
      REFERENCE_SCANNER_SCAN_TIMEOUT: ${NOTARX_SCANNER_TIMEOUT:-10m}
      REFERENCE_SCANNER_HEALTH_TIMEOUT: ${NOTARX_SCANNER_HEALTH_TIMEOUT:-10s}
      REFERENCE_SCANNER_MAX_ARTIFACT_BYTES: ${REFERENCE_SCANNER_MAX_ARTIFACT_BYTES:-1073741824}
      REFERENCE_SCANNER_MAX_OUTPUT_BYTES: ${REFERENCE_SCANNER_MAX_OUTPUT_BYTES:-67108864}
      REFERENCE_SCANNER_MAX_CONCURRENT: ${REFERENCE_SCANNER_MAX_CONCURRENT:-1}
      REFERENCE_SCANNER_SBOM_DIR: /var/lib/reference-scanner/sboms
      REFERENCE_SCANNER_BASE_URL: http://127.0.0.1:18082
      REFERENCE_SCANNER_MAX_SBOM_BYTES: ${REFERENCE_SCANNER_MAX_SBOM_BYTES:-2147483648}
      HTTP_PROXY: ${NOTARX_EGRESS_PROXY:-}
      HTTPS_PROXY: ${NOTARX_EGRESS_PROXY:-}
      NO_PROXY: 127.0.0.1,localhost
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    tmpfs:
      - /tmp:size=1610612736,mode=1777
    volumes:
      - gateway-trivy-cache:/var/cache/trivy
      - gateway-scanner-sboms:/var/lib/reference-scanner/sboms
    healthcheck:
      test: ["CMD", "/usr/local/bin/reference-scanner-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  reference-apt-signer:
    profiles: ["apt-signer"]
    image: ${NOTARX_APT_SIGNER_IMAGE:-notarx-reference-apt-signer:local}
    build:
      context: .
      dockerfile: Dockerfile.apt-signer
    depends_on:
      gateway:
        condition: service_healthy
    # Private keys remain in this container and the signer binds only the
    # loopback interface shared with Gateway's network namespace.
    network_mode: "service:gateway"
    environment:
      REFERENCE_APT_SIGNER_LISTEN_ADDRESS: 127.0.0.1:18083
      REFERENCE_APT_SIGNER_TOKEN: ${NOTARX_APT_SIGNER_TOKEN:-}
      REFERENCE_APT_SIGNER_KEY_FILE: /var/lib/reference-apt-signer/apt-release-private.gpg
      REFERENCE_APT_SIGNER_RSA_BITS: ${REFERENCE_APT_SIGNER_RSA_BITS:-4096}
      REFERENCE_APT_SIGNER_MAX_RELEASE_BYTES: ${REFERENCE_APT_SIGNER_MAX_RELEASE_BYTES:-16777216}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    volumes:
      - gateway-apt-signer:/var/lib/reference-apt-signer
    healthcheck:
      test: ["CMD", "/usr/local/bin/reference-apt-signer-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${NOTARX_POSTGRES_PASSWORD:?set NOTARX_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NOTARX_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gateway-postgres:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${NOTARX_POSTGRES_PASSWORD:?set NOTARX_POSTGRES_PASSWORD in .env}
    entrypoint: ["/usr/local/bin/run-migrations"]
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/run-migrations.sh:/usr/local/bin/run-migrations:ro

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    entrypoint: ["/bin/sh", "/usr/local/bin/run-rustfs"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_RPC_SECRET: ${RUSTFS_RPC_SECRET:?set RUSTFS_RPC_SECRET in .env}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - gateway-rustfs:/data
      - ./scripts/run-rustfs.sh:/usr/local/bin/run-rustfs:ro

  rustfs-ready:
    image: curlimages/curl:8.23.0
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for attempt in $$(seq 1 30); do curl --fail --silent --max-time 2 http://rustfs:9000/health > /dev/null && exit 0; sleep 1; done; echo 'RustFS readiness deadline exceeded after 30 attempts.' >&2; exit 1"]

volumes:
  gateway-postgres:
  gateway-rustfs:
  gateway-trivy-cache:
  gateway-scanner-sboms:
  gateway-apt-signer:
