---
x-gateway-protocol-overlay:
  officialSpecification: https://huggingface.co/docs/hub/api
  gatewayDecision: >-
    ADR 0027. HF_ENDPOINT=https://host/hf/{repository} selects a Hugging Face repository (Proxy
    or Hosted); the Hub repo id (org/name) follows in the path exactly as on the Hub, and datasets
    live under /datasets/. A resolve request answers with the immutable commit in X-Repo-Commit,
    and the bytes of a GET are those of that commit: a mutable ref is never re-resolved between the
    HEAD and the GET that follow it. HEAD answers from stored commit and file metadata, so a
    commit that was read before works offline; a file that was never fetched fails with 504
    upstream_unavailable while upstream is down. Cold objects stream through a tee with sha256
    verification, and Range and If-Range are served from the staging file or the store. Xet is
    not implemented: X-Xet-Hash and Xet link headers are never forwarded, the Xet read-token
    route is 404, and a file served only through Xet fails with 502 upstream_xet_only. Spaces are
    not supported (404 unsupported_repo_type). Errors use the Hub shape, a JSON body with an
    error message and an X-Error-Code header.
huggingface_model_resolve:
  servers: [{url: https://gateway.example.com}]
  parameters:
    - {$ref: '../components/parameters.yaml#/RepositoryName'}
    - {name: org, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 96}}
    - {name: name, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 96}}
    - name: revision
      in: path
      required: true
      description: A branch, a tag or a full commit sha. A slash inside a branch name is percent encoded.
      schema: {type: string, minLength: 1, maxLength: 255}
    - name: path
      in: path
      required: true
      allowReserved: true
      description: Path of the file in the commit, at most 512 characters, without empty, dot or dot-dot segments.
      schema: {type: string, minLength: 1, maxLength: 2048}
  get:
    operationId: resolveHuggingFaceModelFile
    description: Stream a file of a model repository.
    security: [{protocolBearerAuth: []}, {protocolBasicAuth: []}, {}]
    parameters:
      - {name: Range, in: header, schema: {type: string}}
      - {name: If-Range, in: header, schema: {type: string}}
    responses:
      '200': {$ref: '../components/responses.yaml#/HuggingFaceFile'}
      '206': {$ref: '../components/responses.yaml#/HuggingFaceRange'}
      '401': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '403': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '404': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '413': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '416': {description: The range cannot be satisfied}
      '502': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '503': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '504': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '507': {$ref: '../components/responses.yaml#/HuggingFaceError'}
  head:
    operationId: headHuggingFaceModelFile
    description: >-
      Metadata of a file of a model repository: commit, ETag and, for LFS files, the linked ETag
      and size. Never redirects and never fetches the bytes.
    security: [{protocolBearerAuth: []}, {protocolBasicAuth: []}, {}]
    responses:
      '200': {$ref: '../components/responses.yaml#/HuggingFaceHead'}
      '401': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '403': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '404': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '502': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '504': {$ref: '../components/responses.yaml#/HuggingFaceError'}
huggingface_dataset_resolve:
  servers: [{url: https://gateway.example.com}]
  parameters:
    - {$ref: '../components/parameters.yaml#/RepositoryName'}
    - {name: org, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 96}}
    - {name: name, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 96}}
    - {name: revision, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
    - {name: path, in: path, required: true, allowReserved: true, schema: {type: string, minLength: 1, maxLength: 2048}}
  get:
    operationId: resolveHuggingFaceDatasetFile
    description: Stream a file of a dataset repository. Same behaviour as for a model.
    security: [{protocolBearerAuth: []}, {protocolBasicAuth: []}, {}]
    parameters:
      - {name: Range, in: header, schema: {type: string}}
      - {name: If-Range, in: header, schema: {type: string}}
    responses:
      '200': {$ref: '../components/responses.yaml#/HuggingFaceFile'}
      '206': {$ref: '../components/responses.yaml#/HuggingFaceRange'}
      '401': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '403': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '404': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '413': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '416': {description: The range cannot be satisfied}
      '502': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '503': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '504': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '507': {$ref: '../components/responses.yaml#/HuggingFaceError'}
  head:
    operationId: headHuggingFaceDatasetFile
    description: Metadata of a file of a dataset repository.
    security: [{protocolBearerAuth: []}, {protocolBasicAuth: []}, {}]
    responses:
      '200': {$ref: '../components/responses.yaml#/HuggingFaceHead'}
      '401': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '403': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '404': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '502': {$ref: '../components/responses.yaml#/HuggingFaceError'}
      '504': {$ref: '../components/responses.yaml#/HuggingFaceError'}
huggingface_xet_read_token:
  servers: [{url: https://gateway.example.com}]
  parameters:
    - {$ref: '../components/parameters.yaml#/RepositoryName'}
    - {name: repoType, in: path, required: true, schema: {type: string, enum: [models, datasets]}}
    - {name: org, in: path, required: true, schema: {type: string}}
    - {name: name, in: path, required: true, schema: {type: string}}
    - {name: revision, in: path, required: true, schema: {type: string}}
  get:
    operationId: getHuggingFaceXetReadToken
    description: Xet is not implemented, so no read token is ever issued. Clients fall back to plain HTTP.
    security: [{}]
    responses:
      '404': {$ref: '../components/responses.yaml#/HuggingFaceError'}
