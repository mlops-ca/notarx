promotion_rules:
  get:
    operationId: listPromotionRules
    description: >-
      Lists promotion rules by name, paged by keyset on the unique name; continue with the nextPageToken of the previous page. A platform administrator sees every rule; any other caller sees the rules whose source repository it administers. sourceRepositoryId restricts the list to one source repository, which the caller must administer.
    parameters:
    - name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    - name: sourceRepositoryId
      in: query
      schema: {type: string, format: uuid}
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/PromotionRuleList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createPromotionRule
    description: >-
      Creates a promotion rule. The caller needs repository administration on the source and a local target (a remote target needs a platform administrator), and must hold at least the permissions the run-as service account holds on both repositories unless the caller is a platform administrator; otherwise the answer is 403 confused_deputy. The match and the conditions are compiled and validated against the source format: a malformed document is 400, properties on a repository that is not a versioned generic one and refs on a format without tags are 422 unsupported_match, and scope release on a format without the ReleaseSet capability is 422 unsupported_format. A source repository holds at most NOTARX_PROMOTION_MAX_RULES_PER_REPOSITORY rules (409 rule_limit_reached). The mode is copy.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreatePromotionRule"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/PromotionRule"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
promotion_rules_ruleId:
  parameters:
  - "$ref": "../components/parameters.yaml#/PromotionRuleId"
  get:
    operationId: getPromotionRule
    description: Returns one rule; the caller must administer its source repository.
    responses:
      '200':
        "$ref": "../components/responses.yaml#/PromotionRule"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  put:
    operationId: updatePromotionRule
    description: >-
      Replaces the rule; the source repository cannot change. The same authorization and validation as create apply. Every edit increments the version and is written to the audit log with the editor, who is also recorded as updatedBy.
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/UpdatePromotionRule"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/PromotionRule"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
  delete:
    operationId: deletePromotionRule
    description: Deletes the rule; the caller must administer its source repository. The deletion is written to the audit log.
    responses:
      '204':
        description: The promotion rule was deleted
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
promotion_rules_ruleId_dry_run:
  parameters:
  - "$ref": "../components/parameters.yaml#/PromotionRuleId"
  post:
    operationId: dryRunPromotionRule
    description: >-
      Evaluates the rule against the current artifacts of its source repository and reports the matched artifacts with a verdict per condition. It never enqueues a promotion and never writes. The caller needs repository administration on the source and a local target. Conditions that cannot be evaluated yet are reported as not_evaluated with a reason. At most 5000 artifacts are examined; truncated says whether the answer is incomplete.
    parameters:
    - name: limit
      in: query
      description: Most matched artifacts returned.
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/PromotionRuleDryRun"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
