---
lifecycle_jobs:
  get:
    operationId: listLifecycleJobs
    description: >-
      Lists the newest lifecycle jobs across repositories for the administrator console, paged by keyset on creation time then id (newest first): continue with the nextPageToken of the previous page. A platform administrator sees every repository; any other caller sees only the repositories it administers, so a repository it cannot administer contributes no rows and is indistinguishable from one that does not exist. Rows are filtered before the page is cut, so every page holds limit rows until the last one.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 500
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RepositoryLifecycleJobList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"

repositories_repositoryId_lifecycle_jobs:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listRepositoryLifecycleJobs
    description: >-
      Lists a repository's lifecycle jobs newest first, paged by keyset on creation time then id; continue with the nextPageToken of the previous page.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/LifecycleJobList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"

repositories_repositoryId_artifact_scans:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: getRepositoryArtifactScanStatus
    summary: Get the latest durable scan status for one immutable artifact
    parameters:
    - name: coordinate
      in: query
      required: true
      schema: {type: string, minLength: 1, maxLength: 1024}
    - name: digest
      in: query
      required: true
      schema: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    responses:
      '200':
        description: Latest scan status, including never scanned
        content:
          application/json:
            schema: {"$ref": "../components/schemas.yaml#/ArtifactScanStatus"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
  post:
    operationId: createRepositoryArtifactScan
    summary: Queue an external scan for one immutable artifact
    parameters:
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/ArtifactScanRequest"
    responses:
      '202': {"$ref": "#/components/responses/LifecycleJob"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}
      '503': {"$ref": "../components/responses.yaml#/Problem"}

repositories_repositoryId_artifact_scans_reconcile:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  post:
    operationId: reconcileRepositoryArtifactScans
    summary: Reconcile visible publications with the durable scan queue
    description: Prioritizes visible immutable artifacts with missing, failed, or
      cancelled scans, enqueues missing scans with stable idempotency keys, and
      retries failed or cancelled scans. Repeated calls progress through large
      repositories without requiring automatic publication scanning to be enabled.
    parameters:
    - name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
    responses:
      '200':
        description: Scan reconciliation summary
        content:
          application/json:
            schema: {"$ref": "../components/schemas.yaml#/ArtifactScanReconciliation"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '500': {"$ref": "../components/responses.yaml#/Problem"}
      '503': {"$ref": "../components/responses.yaml#/Problem"}

repositories_repositoryId_lifecycle_jobs_reconcile_intelligence:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  post:
    operationId: reconcileRepositoryArtifactIntelligence
    summary: Requeue failed artifact intelligence copy jobs
    description: Requeues up to 100 failed or cancelled intelligence copy jobs
      for this repository. Running, pending, retrying, and completed jobs are
      left unchanged. Candidate selection and state reset are atomic.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    responses:
      '200':
        description: Reconciliation summary
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/LifecycleJobReconciliation"
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '500': {"$ref": "../components/responses.yaml#/Problem"}

repositories_repositoryId_lifecycle_jobs_lifecycleJobId_run:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/LifecycleJobId"
  post:
    operationId: runRepositoryLifecycleJobNow
    responses:
      '200': {"$ref": "#/components/responses/LifecycleJob"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}

repositories_repositoryId_lifecycle_jobs_lifecycleJobId_retry:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/LifecycleJobId"
  post:
    operationId: retryRepositoryLifecycleJob
    responses:
      '200': {"$ref": "#/components/responses/LifecycleJob"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}

repositories_repositoryId_lifecycle_jobs_lifecycleJobId_cancel:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/LifecycleJobId"
  post:
    operationId: cancelRepositoryLifecycleJob
    responses:
      '200': {"$ref": "#/components/responses/LifecycleJob"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}

components:
  responses:
    LifecycleJob:
      description: Updated lifecycle job
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/LifecycleJob"
