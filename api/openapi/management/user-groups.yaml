---
user_groups:
  get:
    operationId: listUserGroups
    description: >-
      Pages user groups by keyset on creation time then id: continue with the nextPageToken of the previous page.
      A user group is a set of accounts that a repository grant can name as the principal group:<id>
      (ADR 0018). Administrator only.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/UserGroupList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createUserGroup
    description: >-
      Creates a local group, or a claims-sourced group that a login matches by the external id of its provider.
      SCIM groups are created only by the SCIM server and every new group starts with global role none.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateUserGroup"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/UserGroup"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
user_groups_groupId:
  parameters:
  - "$ref": "../components/parameters.yaml#/UserGroupId"
  get:
    operationId: getUserGroup
    responses:
      '200':
        "$ref": "../components/responses.yaml#/UserGroup"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  put:
    operationId: renameUserGroup
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/RenameUserGroup"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/UserGroup"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
  delete:
    operationId: deleteUserGroup
    description: Deletes the group with its memberships. A group recreated afterwards starts again at global role none.
    responses:
      '204':
        description: User group deleted
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
user_groups_groupId_global_role:
  parameters:
  - "$ref": "../components/parameters.yaml#/UserGroupId"
  put:
    operationId: setUserGroupGlobalRole
    description: >-
      Flags the group with a global role that raises the level of its members (the highest of the account's own
      role and the roles of its groups) at authentication time. A claims-sourced group only ever has role none.
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/SetUserGroupGlobalRole"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/UserGroup"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
user_groups_groupId_members:
  parameters:
  - "$ref": "../components/parameters.yaml#/UserGroupId"
  get:
    operationId: listUserGroupMembers
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/UserGroupMemberList"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: addUserGroupMember
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/AddUserGroupMember"
    responses:
      '204':
        description: Member added
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
user_groups_groupId_members_userId:
  parameters:
  - "$ref": "../components/parameters.yaml#/UserGroupId"
  - name: userId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  delete:
    operationId: removeUserGroupMember
    description: Removes the membership; the account loses what the group granted on its next request.
    responses:
      '204':
        description: Member removed
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
