repositories_repositoryId_packages:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  get:
    operationId: listRawPackages
    description: Lists the packages of a versioned Raw repository (ADR 0028) with their latest sealed version and version count, ordered by name with keyset pagination. Requires repository read permission. `latestVersion` is the newest sealed version by seal time, not the highest semantic version. Tombstoned versions are not counted, and a package whose versions are all tombstoned is not listed. A repository with the `path` layout answers `422 layout_mismatch`.
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RawPackagePage"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_packages_name_versions:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/RawPackageName"
  get:
    operationId: listRawVersions
    description: Lists the versions of one package, newest seal first with unsealed versions last, using keyset pagination. Requires repository read permission. `state` keeps only open or sealed versions. `property` filters on a frozen or open property as `key:value` and may repeat, all filters must match. `olderThanDays` keeps only open versions created more than N days ago, so stale open versions can be reported and acted on by an operator; it requires `state=open`. Tombstoned versions are never listed.
    parameters:
    - name: state
      in: query
      schema:
        "$ref": "../components/schemas.yaml#/RawVersionState"
    - name: property
      in: query
      description: Property filter `key:value`; repeat the parameter to require several, which combine with AND.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          minLength: 3
          maxLength: 330
    - name: olderThanDays
      in: query
      description: Only open versions created more than this many days ago. Requires `state=open`.
      schema:
        type: integer
        minimum: 1
        maximum: 36500
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RawVersionPage"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_packages_name_versions_version:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/RawPackageName"
  - "$ref": "../components/parameters.yaml#/RawVersionIdentifier"
  get:
    operationId: getRawVersion
    description: Returns one version with its files (path, size, sha256, content type), properties, state and, once sealed, the manifest digest. `createdAt` is the creation time and `lastWriteAt` the time of the last file, property or seal change, so a stale open version can be told from an active one. Requires repository read permission. A tombstoned version is `404`.
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RawVersion"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
  put:
    operationId: createRawVersion
    description: Creates an `open` version explicitly, optionally with properties, before or without any file upload. Idempotent while the version is open, and then replaces the properties when the body carries them. Requires repository write permission. A sealed version answers `409 version_sealed`, a tombstoned one `409 version_tombstoned`, and a properties map outside its bounds `422 invalid_properties`.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/RawVersionCreate"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RawVersion"
      '201':
        "$ref": "../components/responses.yaml#/RawVersion"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_packages_name_versions_version_properties:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/RawPackageName"
  - "$ref": "../components/parameters.yaml#/RawVersionIdentifier"
  put:
    operationId: setRawVersionProperties
    description: Replaces the whole property map of an open version. Requires repository write permission. At most 32 keys, keys match `^[a-z][a-z0-9._-]{0,63}$`, values are at most 256 bytes of UTF-8 without control or bidirectional characters, 8 KiB in total, otherwise `422 invalid_properties`. Properties freeze at seal and are part of the manifest digest, so a sealed version answers `409 version_sealed`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/RawVersionProperties"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RawVersion"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_packages_name_versions_version_seal:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/RawPackageName"
  - "$ref": "../components/parameters.yaml#/RawVersionIdentifier"
  post:
    operationId: sealRawVersion
    description: Seals a version under its row lock, which serialises the seal against concurrent uploads. Requires repository write permission. An empty version is `422 version_empty`. `files` is an expected file list that must equal the stored set exactly, and `checksumsFile` names a stored file parsed as `sha256sum` output whose every entry must match a stored file; a difference is `422 checksum_mismatch`. `properties`, when present, replace the open version's properties before they freeze. The manifest digest is always computed on the server from the stored digests. Sealing twice is idempotent and returns the same digest.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/RawVersionSeal"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/RawVersion"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_packages_name_versions_version_manifest:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/RawPackageName"
  - "$ref": "../components/parameters.yaml#/RawVersionIdentifier"
  get:
    operationId: getRawVersionManifest
    description: Returns the canonical manifest of a sealed version, derived on request and never stored, as UTF-8 JSON with sorted keys and no insignificant whitespace. The `sha256` of exactly these bytes is the manifest digest. Requires repository read permission. An open version answers `409 version_not_sealed`; a tombstoned one is `404`.
    responses:
      '200':
        description: The canonical manifest bytes.
        headers:
          ETag:
            description: The strong entity tag, the manifest digest as `"sha256:<hex>"`.
            schema:
              type: string
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/RawVersionManifest"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
repositories_repositoryId_packages_name_versions_version_checksums:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  - "$ref": "../components/parameters.yaml#/RawPackageName"
  - "$ref": "../components/parameters.yaml#/RawVersionIdentifier"
  get:
    operationId: getRawVersionChecksums
    description: Returns `sha256sum -c` compatible text for the files of a version, one `<hex>  <path>` line per file sorted by path, with paths relative to the version. Requires repository read permission. Available for open and sealed versions; a tombstoned one is `404`.
    responses:
      '200':
        description: The checksums text.
        content:
          text/plain:
            schema:
              type: string
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '422':
        "$ref": "../components/responses.yaml#/Problem"
