        content:
          application/json:
            schema: {"$ref": "../components/workload-identity.yaml#/WorkloadTrustPolicy"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
  patch:
    operationId: updateWorkloadTrustPolicy
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: {"$ref": "../components/workload-identity.yaml#/UpdateWorkloadTrustPolicy"}
    responses:
      '200':
        description: Workload trust policy updated
        content:
          application/json:
            schema: {"$ref": "../components/workload-identity.yaml#/WorkloadTrustPolicy"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '412': {"$ref": "../components/responses.yaml#/Problem"}
  delete:
    operationId: deleteWorkloadTrustPolicy
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    responses:
      '204': {description: Workload trust policy deleted}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '412': {"$ref": "../components/responses.yaml#/Problem"}
workload_identity_policies_test:
  post:
    operationId: testWorkloadTrustPolicy
    requestBody:
      required: true
      content:
        application/json:
          schema: {"$ref": "../components/workload-identity.yaml#/TestWorkloadPolicyRequest"}
    responses:
      '200':
        description: Dry-run result
        content:
          application/json:
            schema: {"$ref": "../components/workload-identity.yaml#/WorkloadPolicyTest"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
