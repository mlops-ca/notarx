---
workload_identity_issuers:
  get:
    operationId: listWorkloadIssuers
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        description: Workload issuers
        content:
          application/json:
            schema: {"$ref": "../components/workload-identity.yaml#/WorkloadIssuerList"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
  post:
    operationId: createWorkloadIssuer
    requestBody:
      required: true
      content:
        application/json:
          schema: {"$ref": "../components/workload-identity.yaml#/CreateWorkloadIssuer"}
    responses:
      '201':
        description: Workload issuer created
        content:
          application/json:
            schema: {"$ref": "../components/workload-identity.yaml#/WorkloadIssuer"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}
workload_identity_issuers_issuerId:
  parameters:
  - name: issuerId
    in: path
    required: true
    schema: {type: string, format: uuid}
  get:
    operationId: getWorkloadIssuer
    responses:
      '200':
        description: Workload issuer
        content:
          application/json:
            schema: {"$ref": "../components/workload-identity.yaml#/WorkloadIssuer"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
  patch:
    operationId: updateWorkloadIssuer
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: {"$ref": "../components/workload-identity.yaml#/UpdateWorkloadIssuer"}
    responses:
      '200':
        description: Workload issuer updated
        content:
          application/json:
            schema: {"$ref": "../components/workload-identity.yaml#/WorkloadIssuer"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '412': {"$ref": "../components/responses.yaml#/Problem"}
  delete:
    operationId: deleteWorkloadIssuer
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    responses:
      '204': {description: Workload issuer deleted}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}
      '412': {"$ref": "../components/responses.yaml#/Problem"}
workload_identity_issuers_probe:
  post:
    operationId: probeWorkloadIssuer
    requestBody:
      required: true
      content:
        application/json:
          schema: {"$ref": "../components/workload-identity.yaml#/ProbeWorkloadIssuerRequest"}
    responses:
      '200':
        description: Probe result; reachable is false with the error when the issuer could not be read
        content:
          application/json:
            schema: {"$ref": "../components/workload-identity.yaml#/WorkloadIssuerProbe"}
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
