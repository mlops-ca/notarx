---
security_settings:
  get:
    operationId: getSecuritySettings
    summary: Read-only security settings of this deployment
    description: >-
      Returns the authorization cache window (NOTARX_AUTHZ_CACHE_TTL, ADR 0023
      section 6): the longest time a revoked API key, a disabled service account
      or a revoked service-account credential can still be honoured by a node
      when an invalidation is lost. The value comes from the node's configuration and
      changes only by restarting it. Requires an administrator.
    responses:
      '200':
        description: Current security settings.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/SecuritySettings"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
identity_providers:
  get:
    operationId: listIdentityProviders
    responses:
      '200':
        "$ref": "../components/responses.yaml#/IdentityProviderList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createIdentityProvider
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateIdentityProvider"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/IdentityProvider"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
identity_providers_providerId:
  parameters:
  - name: providerId
    in: path
    required: true
    schema: {type: string, format: uuid}
  get:
    operationId: getIdentityProvider
    responses:
      '200':
        "$ref": "../components/responses.yaml#/IdentityProvider"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  put:
    operationId: replaceIdentityProvider
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/ReplaceIdentityProvider"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/IdentityProvider"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
  delete:
    operationId: deleteIdentityProvider
    description: Deletes a provider that has no linked identities.
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    responses:
      '204':
        description: Provider deleted
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
identity_providers_providerId_test:
  parameters:
  - name: providerId
    in: path
    required: true
    schema: {type: string, format: uuid}
  post:
    operationId: testIdentityProvider
    responses:
      '200':
        "$ref": "../components/responses.yaml#/OIDCConnectionTest"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
identity_providers_providerId_import_metadata:
  parameters:
  - name: providerId
    in: path
    required: true
    schema: {type: string, format: uuid}
  post:
    operationId: importIdentityProviderMetadata
    description: >
      Imports IdP metadata into a SAML provider: the entity id, the HTTP-Redirect SSO endpoint and the
      signing certificates. Certificates not yet pinned are added as next when the provider already
      pins one. Admin only. Send exactly one of url (fetched through the SSRF guard) and xml.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/ImportIdentityProviderMetadata"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/IdentityProvider"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
identity_providers_providerId_rotate_sp_key:
  parameters:
  - name: providerId
    in: path
    required: true
    schema: {type: string, format: uuid}
  post:
    operationId: rotateIdentityProviderSPKey
    description: >
      Generates a new service provider signing key for a SAML provider. The previous key stays published
      in the SP metadata, so two keys are active until the next rotation. The private key is sealed
      and never returned.
    responses:
      '200':
        "$ref": "../components/responses.yaml#/IdentityProvider"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
identity_providers_providerId_scim_tokens:
  parameters:
  - name: providerId
    in: path
    required: true
    schema: {type: string, format: uuid}
  get:
    operationId: listSCIMTokens
    description: >
      Lists the SCIM bearer tokens of one provider, oldest first, with their expiry and revoked state. The secret is
      never returned. Admin only.
    responses:
      '200':
        "$ref": "../components/responses.yaml#/SCIMTokenList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createSCIMToken
    description: >
      Creates a SCIM bearer token for this provider only (ADR 0018 section 4). The plaintext token is returned once
      in this response and is never stored or logged; only its hash is kept. expiresAt is mandatory, in the future
      and at most 365 days ahead. Admin only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateSCIMToken"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/CreatedSCIMToken"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
identity_providers_providerId_scim_tokens_tokenId:
  parameters:
  - name: providerId
    in: path
    required: true
    schema: {type: string, format: uuid}
  - name: tokenId
    in: path
    required: true
    schema: {type: string, format: uuid}
  delete:
    operationId: revokeSCIMToken
    description: >
      Revokes the token; it stops authenticating at once. The record stays in the list as revoked. Revoking a
      revoked token keeps the first revocation time. Admin only.
    responses:
      '200':
        "$ref": "../components/responses.yaml#/SCIMToken"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
identity_providers_providerId_links:
  parameters:
  - name: providerId
    in: path
    required: true
    schema: {type: string, format: uuid}
  post:
    operationId: linkIdentityProviderAccount
    description: >
      Binds a login subject of this provider to a notarx account (ADR 0018 section 4): the admin link flow for a
      provider that does not assert externalId. It completes the identity row a SCIM create left without a subject,
      or creates the row for an account the provider never provisioned. A subject already bound to another account,
      or an account already bound to another subject at this provider, is 409. Audited. Admin only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateProviderLink"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/UserIdentity"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"
