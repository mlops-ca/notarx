---
public_access_policy:
  get:
    operationId: getPublicAccessPolicy
    responses:
      '200':
        "$ref": "../components/responses.yaml#/PublicAccessPolicy"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
  put:
    operationId: replacePublicAccessPolicy
    parameters:
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/PublicAccessPolicy"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/PublicAccessPolicy"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"
