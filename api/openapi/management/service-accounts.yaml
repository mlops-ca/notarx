---
service_accounts:
  get:
    operationId: listServiceAccounts
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createServiceAccount
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateServiceAccount"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/ServiceAccount"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"

service_accounts_serviceAccountId:
  put:
    operationId: updateServiceAccount
    parameters:
    - name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - "$ref": "../components/parameters.yaml#/IfMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/UpdateServiceAccount"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccount"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '412':
        "$ref": "../components/responses.yaml#/Problem"

service_accounts_serviceAccountId_credentials:
  parameters:
  - name: serviceAccountId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: listServiceAccountCredentials
    parameters:
    - "$ref": "../components/parameters.yaml#/PageSize"
    - "$ref": "../components/parameters.yaml#/PageToken"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountCredentialList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: createServiceAccountCredential
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/CreateServiceAccountCredential"
    responses:
      '201':
        "$ref": "../components/responses.yaml#/CreatedServiceAccountCredential"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"

service_accounts_serviceAccountId_credentials_credentialId:
  delete:
    operationId: revokeServiceAccountCredential
    parameters:
    - name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountCredential"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"

service_accounts_serviceAccountId_assertions:
  parameters:
  - name: serviceAccountId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  post:
    operationId: mintServiceAccountAssertion
    tags: [service-accounts]
    description: >-
      Mints a short-lived JWT assertion signed by the notarx OIDC issuer (ADR 0020) for an audience on the allow-list
      of the service account. This is outbound minting, distinct from the inbound workload token exchange. The caller
      is the service account itself, authenticated with one of its API keys or as a federated workload principal
      (ADR 0019) that resolves to it; human users and the static administrator token are refused with 403. The
      response is never cached. An audience that is not on the allow-list is refused with the problem code
      assertion_audience_not_allowed; there is no wildcard and no default allow-list. The lifetime is bounded by the
      allow-list entry and by NOTARX_ISSUER_MAX_TOKEN_LIFETIME. Every mint is audited without the token.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/MintServiceAccountAssertion"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountAssertion"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
      '503':
        "$ref": "../components/responses.yaml#/Problem"

service_accounts_serviceAccountId_assertion_audiences:
  parameters:
  - name: serviceAccountId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  get:
    operationId: listServiceAccountAssertionAudiences
    tags: [service-accounts]
    description: Lists the assertion audience allow-list of a service account. Administrator only.
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountAssertionAudienceList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
  post:
    operationId: putServiceAccountAssertionAudience
    tags: [service-accounts]
    description: >-
      Allows an audience for assertions of a service account, or replaces the maximum lifetime of an audience that is
      already allowed (201 when added, 200 when replaced). Enabling issuance for an account is an explicit act that is
      recorded in the audit log, like every change of the allow-list. Administrator only.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/PutServiceAccountAssertionAudience"
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ServiceAccountAssertionAudience"
      '201':
        "$ref": "../components/responses.yaml#/ServiceAccountAssertionAudience"
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
  delete:
    operationId: deleteServiceAccountAssertionAudience
    tags: [service-accounts]
    description: >-
      Removes an audience from the allow-list. The audience is a query parameter because it is usually a URI.
      Administrator only.
    parameters:
    - name: audience
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    responses:
      '204':
        description: The audience was removed
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"

assertion_subjects:
  get:
    operationId: listAssertionSubjects
    tags: [service-accounts]
    description: >-
      Lists the reserved assertion subjects (ADR 0020). A subject stays reserved after its service account is deleted;
      such an orphaned reservation is flagged and can be released. Administrator only.
    responses:
      '200':
        "$ref": "../components/responses.yaml#/AssertionSubjectList"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"

assertion_subjects_subject:
  parameters:
  - name: subject
    in: path
    required: true
    description: The reserved subject, percent-encoded because it may contain reserved characters
    schema:
      type: string
      minLength: 1
      maxLength: 255
  delete:
    operationId: releaseAssertionSubject
    tags: [service-accounts]
    description: >-
      Releases a reserved subject so that a new service account can take it (ADR 0020). Only a reservation without an
      owner can be released; a subject held by a live service account answers 409. The release is audited.
      Administrator only.
    responses:
      '204':
        description: The subject was released
      '400':
        "$ref": "../components/responses.yaml#/Problem"
      '401':
        "$ref": "../components/responses.yaml#/Problem"
      '403':
        "$ref": "../components/responses.yaml#/Problem"
      '404':
        "$ref": "../components/responses.yaml#/Problem"
      '409':
        "$ref": "../components/responses.yaml#/Problem"
