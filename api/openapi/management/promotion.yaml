---
repositories_repositoryId_promotions:
  parameters:
  - "$ref": "../components/parameters.yaml#/RepositoryId"
  post:
    operationId: createRepositoryPromotion
    parameters:
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/PromotionRequest"
    responses:
      '202':
        description: Immutable artifact promotion job accepted. The Notarx-Promotion-Id header names the provenance row of the attempt (see listArtifactPromotions); a replay of the same Idempotency-Key returns the same job and the same row.
        headers:
          Notarx-Promotion-Id:
            description: Id of the artifact promotion (provenance) row written with the job.
            schema: {type: string, format: uuid}
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/LifecycleJob"
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}
      '422': {"$ref": "../components/responses.yaml#/Problem"}

artifact_promotions:
  get:
    operationId: listArtifactPromotions
    summary: List artifact promotions (provenance)
    description: >-
      Lists the provenance rows of promotions, one per attempt, newest first, paged by keyset on creation time then id: continue with the nextPageToken of the previous page. A platform administrator sees every target repository; any other caller sees only the promotions into repositories it may read, and a repository it cannot read contributes no rows and is indistinguishable from one that does not exist. Rows are filtered before the page is cut, so every page holds limit rows until the last one.
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    - "$ref": "../components/parameters.yaml#/PageToken"
    - name: targetRepositoryId
      in: query
      schema: {type: string, format: uuid}
    - name: format
      in: query
      schema: {"$ref": "../components/schemas.yaml#/Format"}
    - name: state
      in: query
      schema: {"$ref": "../components/schemas.yaml#/ArtifactPromotionState"}
    - name: coordinate
      in: query
      schema: {type: string, minLength: 1, maxLength: 1024}
    - name: digest
      in: query
      schema: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    responses:
      '200':
        "$ref": "../components/responses.yaml#/ArtifactPromotionList"
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}

promotion_batches:
  post:
    operationId: createPromotionBatch
    summary: Promote up to 100 artifacts from one repository in one batch
    description: >-
      Admission is all-or-nothing: every item must pass the source quarantine recheck, the target admission policy and
      authorisation (the caller administers both repositories) before any item is queued; otherwise nothing is queued and
      the 422 problem lists the refused items (code promotion_batch_rejected). Execution is per item through the
      promotion service, with an idempotency key derived from the batch id and the item index, so an item never runs
      twice. A replay of the same Idempotency-Key with the same request returns the same batch and completes any item
      that was not yet queued; the same key with a different request is 409 idempotency_conflict. The aggregate state is
      computed from the provenance rows of the items (see getPromotionBatch).
    parameters:
    - "$ref": "../components/parameters.yaml#/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yaml#/PromotionBatchRequest"
    responses:
      '202':
        description: The batch was admitted and its items queued.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/PromotionBatch"
      '400': {"$ref": "../components/responses.yaml#/Problem"}
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
      '409': {"$ref": "../components/responses.yaml#/Problem"}
      '422': {"$ref": "../components/responses.yaml#/Problem"}

promotion_batches_batchId:
  parameters:
  - "$ref": "../components/parameters.yaml#/PromotionBatchId"
  get:
    operationId: getPromotionBatch
    summary: Show a promotion batch with its aggregate state
    description: >-
      Returns the batch, one entry per item with the state of its provenance row, and the aggregate state: pending while
      no item has started, running while any item is unfinished and some progress was made, completed when every item
      completed, failed when every item ended without completing and partially_failed when the items ended and some did
      complete. The caller needs read access to the target repository.
    responses:
      '200':
        description: The promotion batch.
        content:
          application/json:
            schema:
              "$ref": "../components/schemas.yaml#/PromotionBatch"
      '401': {"$ref": "../components/responses.yaml#/Problem"}
      '403': {"$ref": "../components/responses.yaml#/Problem"}
      '404': {"$ref": "../components/responses.yaml#/Problem"}
